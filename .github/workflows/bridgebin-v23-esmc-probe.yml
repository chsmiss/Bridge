name: BridgeBin v2.3 ESM-C protein identity probe

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - scripts/bridgebin_predict_orfs.py
      - scripts/bridgebin_esmc_embed.py
      - scripts/bridgebin_protein_repertoire.py
      - scripts/bridgebin_protein_pair_scores.py
      - scripts/bridgebin_bio_features.py
      - .github/workflows/bridgebin-v23-esmc-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esmc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESM-C CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.0,<3'
          python -m pip install esm pyrodigal numpy
          python -m py_compile scripts/bridgebin_predict_orfs.py scripts/bridgebin_esmc_embed.py scripts/bridgebin_protein_pair_scores.py scripts/bridgebin_protein_repertoire.py
      - name: Build a small independent Zymo protein panel
        run: |
          set -euo pipefail
          base=benchmark/v23_esmc
          mkdir -p "$base"
          curl -L --retry 3 -o /tmp/zymo-refs.zip 'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python scripts/bridgebin_zymo_reference_benchmark.py --reference-dir /tmp/zymo-species-refs --out "$base/full" --seed 43 --min-fragment 5000 --max-fragment 8500 --min-contig 1500
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path
          src=Path('benchmark/v23_esmc/full'); out=Path('benchmark/v23_esmc/panel'); out.mkdir(parents=True,exist_ok=True)
          truth=list(csv.DictReader((src/'truth.tsv').open(),delimiter='\t')); groups=defaultdict(list)
          for row in truth:
              if int(row['eligible']): groups[row['genome']].append(row)
          chosen=[]
          for genome,rs in sorted(groups.items()):
              rs.sort(key=lambda x:(-int(x['length']),x['contig'])); chosen.extend(rs[:2])
          ids={row['contig'] for row in chosen}; seq={}; name=None; chunks=[]
          for raw in (src/'contigs.fa').read_text().splitlines():
              if raw.startswith('>'):
                  if name is not None: seq[name]=''.join(chunks)
                  name=raw[1:].split()[0]; chunks=[]
              else: chunks.append(raw.strip())
          if name is not None: seq[name]=''.join(chunks)
          with (out/'contigs.fa').open('w') as h:
              for cid in sorted(ids):
                  h.write(f'>{cid}\n'); s=seq[cid]
                  for i in range(0,len(s),80): h.write(s[i:i+80]+'\n')
          fields=['contig','genome','length','eligible','record','start','end']
          with (out/'truth.tsv').open('w',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields,delimiter='\t'); w.writeheader(); w.writerows(sorted(chosen,key=lambda x:x['contig']))
          print('protein_panel',len(chosen),'genomes',len(groups))
          PY
      - name: Predict sparse ORFs and embed with ESM-C 300M
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          set -euo pipefail
          p=benchmark/v23_esmc/panel
          python scripts/bridgebin_predict_orfs.py --contigs "$p/contigs.fa" --output-faa "$p/proteins.faa" --mapping "$p/protein_map.tsv" --min-aa 70 --max-proteins-per-contig 3
          python scripts/bridgebin_esmc_embed.py --proteins "$p/proteins.faa" --mapping "$p/protein_map.tsv" --output "$p/esmc.tsv" --model biohub/ESMC-300M --device cpu --batch-size 1 --max-aa 512 --truncate
          python scripts/bridgebin_bio_features.py --protein-embeddings "$p/esmc.tsv" --output "$p/features.tsv"
      - name: Evaluate pooled, set-to-set, and repertoire geometry
        run: |
          set -euo pipefail
          p=benchmark/v23_esmc/panel
          python - <<'PY'
          import csv,itertools
          from pathlib import Path
          p=Path('benchmark/v23_esmc/panel'); truth={r['contig']:r['genome'] for r in csv.DictReader((p/'truth.tsv').open(),delimiter='\t')}; names=sorted(truth)
          with (p/'pairs.tsv').open('w',newline='') as h:
              w=csv.writer(h,delimiter='\t',lineterminator='\n'); w.writerow(['left','right','label'])
              for a,b in itertools.combinations(names,2): w.writerow([a,b,int(truth[a]==truth[b])])
          PY
          python scripts/bridgebin_protein_pair_scores.py --protein-embeddings "$p/esmc.tsv" --pairs "$p/pairs.tsv" --output "$p/protein_set_pairs.tsv"
          for k in 4 8 12; do
            python scripts/bridgebin_protein_repertoire.py fit-transform --embeddings "$p/esmc.tsv" --output "$p/repertoire_k${k}.tsv" --codebook-out "$p/codebook_k${k}.npz" --clusters "$k" --iterations 30 --seed 43
          done
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          p=Path('benchmark/v23_esmc/panel'); truth={r['contig']:r['genome'] for r in csv.DictReader((p/'truth.tsv').open(),delimiter='\t')}
          def auc(rows):
              pos=[s for s,l,a,b in rows if l]; neg=[s for s,l,a,b in rows if not l]; wins=sum(1 if x>y else .5 if x==y else 0 for x in pos for y in neg); return wins/max(1,len(pos)*len(neg))
          def med(x):
              x=sorted(x); n=len(x); return x[n//2] if n%2 else .5*(x[n//2-1]+x[n//2])
          def summary(rows):
              pos=[s for s,l,a,b in rows if l]; neg=[s for s,l,a,b in rows if not l]; hard=[s for s,l,a,b in rows if not l and {truth[a],truth[b]}=={'Escherichia_coli','Salmonella_enterica'}]
              return {'auc':auc(rows),'same_median':med(pos),'different_median':med(neg),'ecoli_salmonella_median':med(hard)}
          result={}
          feats={}
          for r in csv.DictReader((p/'features.tsv').open(),delimiter='\t'):
              raw=r.get('esm_embedding','')
              if raw and raw!='.': feats[r['contig']]=[float(x) for x in raw.split(',')]
          def cos(a,b):
              dot=sum(x*y for x,y in zip(a,b)); na=math.sqrt(sum(x*x for x in a)); nb=math.sqrt(sum(y*y for y in b)); return dot/max(1e-12,na*nb)
          rows=[]; names=sorted(feats)
          for i,a in enumerate(names):
              for b in names[i+1:]: rows.append((cos(feats[a],feats[b]),int(truth[a]==truth[b]),a,b))
          result['pooled']=summary(rows)
          setrows=[]
          for r in csv.DictReader((p/'protein_set_pairs.tsv').open(),delimiter='\t'):
              setrows.append((float(r['protein_set_similarity']),int(r['label']),r['left'],r['right']))
          result['set_to_set']=summary(setrows)
          for k in (4,8,12):
              rep={r['contig']:[float(x) for x in r['protein_repertoire'].split(',')] for r in csv.DictReader((p/f'repertoire_k{k}.tsv').open(),delimiter='\t')}
              rr=[]; names=sorted(rep)
              for i,a in enumerate(names):
                  for b in names[i+1:]: rr.append((cos(rep[a],rep[b]),int(truth[a]==truth[b]),a,b))
              result[f'repertoire_k{k}']=summary(rr)
          (p/'protein_identity.metrics.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridgebin-v23-esmc-probe
          path: benchmark/v23_esmc
          retention-days: 14
