name: Rustfmt autofix

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - src/**/*.rs
      - .github/workflows/rustfmt-autofix.yml

permissions:
  contents: write

concurrency:
  group: rustfmt-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgeasm-rust-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt"
          git push origin HEAD:codex/bridgeasm-rust-v0
