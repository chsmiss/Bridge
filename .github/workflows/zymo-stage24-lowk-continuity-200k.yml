name: Zymo 200k Stage24 low-k continuity forensic

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage24-lowk-continuity-200k.yml
      - scripts/stage24_lowk_continuity_forensic.py
      - scripts/test_stage24_lowk_continuity_forensic.py
      - scripts/stage22_k31_survival_forensic.py
  workflow_dispatch:

concurrency:
  group: zymo-stage24-lowk-continuity-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip minimap2 time

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate Stage24 diagnostic
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/stage22_k31_survival_forensic.py \
            scripts/stage24_lowk_continuity_forensic.py \
            scripts/test_stage24_lowk_continuity_forensic.py
          PYTHONPATH=scripts python3 scripts/test_stage24_lowk_continuity_forensic.py
          cargo build --release

      - name: Build fixed Stage8 and Stage10
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/current \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
            --pipeline-dir benchmark/current \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --segment-anchor-bases 31 \
            --lookahead-depth 3 \
            --lookahead-max-branch 4
          /usr/bin/time -v -o benchmark/stage10.time.txt \
            python3 scripts/stage10_multik_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/current \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" --ks 17,21,25,31
          cp benchmark/current/stage10_multik_rescue/candidate_multik_strict/primary_contigs.fasta \
             benchmark/assemblies/bridge_stage10.fasta

      - name: Recreate Stage10 breakpoint oracle
        run: |
          set -euo pipefail
          minimap2 -x asm5 --secondary=yes /tmp/zymo-references.fasta \
            benchmark/assemblies/bridge_stage10.fasta > benchmark/stage10_vs_reference.paf
          python3 scripts/stage17_breakpoint_oracle.py \
            --reference-dir /tmp/zymo-species-refs \
            --paf benchmark/stage10_vs_reference.paf \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --k21-gfa benchmark/current/current_pipeline/iterative/k21_recall/assembly.gfa \
            --k31-gfa benchmark/current/current_pipeline/iterative/k31_resolve/assembly.gfa \
            --baseline benchmark/assemblies/bridge_stage10.fasta \
            --output-prefix benchmark/oracle

      - name: Recreate Stage22 first-failure counts
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage22.time.txt \
            python3 scripts/stage22_k31_survival_forensic.py \
              --reference-dir /tmp/zymo-species-refs \
              --gaps benchmark/oracle_gaps.tsv \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --k31-gfa benchmark/current/current_pipeline/iterative/k31_resolve/assembly.gfa \
              --stage10 benchmark/assemblies/bridge_stage10.fasta \
              --species Pseudomonas_aeruginosa \
              --output-prefix benchmark/stage22_forensic

      - name: Trace no-k32 runs through k21 graph
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage24.time.txt \
            python3 scripts/stage24_lowk_continuity_forensic.py \
              --reference-dir /tmp/zymo-species-refs \
              --gaps benchmark/oracle_gaps.tsv \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --k21-gfa benchmark/current/current_pipeline/iterative/k21_recall/assembly.gfa \
              --k31-gfa benchmark/current/current_pipeline/iterative/k31_resolve/assembly.gfa \
              --species Pseudomonas_aeruginosa \
              --output-prefix benchmark/stage24_lowk \
            | tee benchmark/stage24.stdout.txt

      - name: Verify Stage22 and Stage24 use identical no-k32 population
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with Path('benchmark/stage22_forensic_summary.tsv').open() as h:
              rows=list(csv.DictReader(h,delimiter='\t'))
          expected=sum(int(r['total']) for r in rows
                       if r['section']=='first_failure' and r['category']=='no_raw_edge_observation')
          observed=json.loads(Path('benchmark/stage24_lowk_stats.json').read_text())['no_raw_k32_transitions']
          print(f'stage22_no_raw_k32={expected}')
          print(f'stage24_no_raw_k32={observed}')
          if expected != observed:
              raise SystemExit(f'population mismatch: Stage22={expected}, Stage24={observed}')
          PY

      - name: Save compact decision report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('benchmark/stage24_lowk_stats.json').read_text())
          p=Path('benchmark/stage24_decision.tsv')
          with p.open('w') as h:
              h.write('metric\tvalue\n')
              for key in ('no_raw_k32_transitions','no_raw_runs','exact_path_transition_fraction',
                          'both_anchor_exact_transition_fraction','direct_actionable_transition_fraction'):
                  h.write(f'{key}\t{s[key]}\n')
              for key,val in sorted(s['category_transitions'].items()):
                  h.write(f'category:{key}\t{val}\n')
              for prefix in ('exact_run_lengths_transitions','actionable_run_lengths_transitions'):
                  for key,val in s[prefix].items():
                      h.write(f'{prefix}:{key}\t{val}\n')
          print(p.read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          cp benchmark/current/current_pipeline/iterative/k21_recall/run_profile.json benchmark/k21_run_profile.json
          cp benchmark/current/current_pipeline/iterative/k31_resolve/run_profile.json benchmark/k31_run_profile.json
          printf 'commit\t%s\nread_pairs\t%s\ndataset\tERR2935805_first_pairs\nmode\treference_only_lowk_continuity_forensic_no_assembler_feedback\n' \
            "$GITHUB_SHA" "$PAIRS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage24-lowk-continuity-200k
          path: |
            benchmark/*.tsv
            benchmark/*.json
            benchmark/*.txt
            benchmark/*.paf
            benchmark/*.time.txt
            benchmark/assemblies/bridge_stage10.fasta
