name: BridgeBin v2.3 DNA expert comparison

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - scripts/bridgebin_genomeocean_embed.py
      - .github/workflows/bridgebin-v23-dna-experts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dna-experts:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtimes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.0,<3'
          python -m pip install 'transformers==4.40.2' einops
          python -m pip uninstall -y triton || true
          python -m py_compile scripts/bridgebin_genomeocean_embed.py scripts/bridgebin_dna_embed.py
      - name: Prepare Zymo 32-contig hard panel
        run: |
          set -euo pipefail
          base=benchmark/v23_dna_experts
          mkdir -p "$base"
          curl -L --retry 3 -o /tmp/zymo-refs.zip 'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python scripts/bridgebin_zymo_reference_benchmark.py --reference-dir /tmp/zymo-species-refs --out "$base/full" --seed 43 --min-fragment 2200 --max-fragment 8500 --min-contig 1500
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path
          src=Path('benchmark/v23_dna_experts/full'); out=Path('benchmark/v23_dna_experts/panel'); out.mkdir(parents=True,exist_ok=True)
          truth=list(csv.DictReader((src/'truth.tsv').open(),delimiter='\t')); groups=defaultdict(list)
          for r in truth:
              if int(r['eligible']): groups[r['genome']].append(r)
          chosen=[]
          for genome,rs in sorted(groups.items()):
              rs.sort(key=lambda x:(-int(x['length']),x['contig'])); chosen.extend(rs[:4])
          ids={r['contig'] for r in chosen}; seq={}; name=None; chunks=[]
          for raw in (src/'contigs.fa').read_text().splitlines():
              if raw.startswith('>'):
                  if name is not None: seq[name]=''.join(chunks)
                  name=raw[1:].split()[0]; chunks=[]
              else: chunks.append(raw.strip())
          if name is not None: seq[name]=''.join(chunks)
          with (out/'contigs.fa').open('w') as h:
              for cid in sorted(ids):
                  h.write(f'>{cid}\n'); s=seq[cid]
                  for i in range(0,len(s),80): h.write(s[i:i+80]+'\n')
          with (out/'truth.tsv').open('w',newline='') as h:
              f=['contig','genome','length','eligible','record','start','end']; w=csv.DictWriter(h,fieldnames=f,delimiter='\t'); w.writeheader(); w.writerows(sorted(chosen,key=lambda x:x['contig']))
          print('panel',len(ids),'genomes',len(groups))
          PY
      - name: Embed with DNABERT-S and GenomeOcean-100M
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          p=benchmark/v23_dna_experts/panel
          python scripts/bridgebin_dna_embed.py --contigs "$p/contigs.fa" --output "$p/dnaberts_windows.tsv" --model zhihan1996/DNABERT-S --device cpu --window-bp 1600 --stride-bp 1600 --min-window-bp 512 --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py --dna-embeddings "$p/dnaberts_windows.tsv" --output "$p/dnaberts_features.tsv"
          python scripts/bridgebin_genomeocean_embed.py --contigs "$p/contigs.fa" --output "$p/genomeocean.tsv" --model DOEJGI/GenomeOcean-100M --device cpu --window-bp 3000 --max-windows-per-contig 2 --max-tokens 1024 --batch-size 2
      - name: Compare identity geometry and expert consensus
        run: |
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          p=Path('benchmark/v23_dna_experts/panel'); truth={r['contig']:r['genome'] for r in csv.DictReader((p/'truth.tsv').open(),delimiter='\t')}
          def parse(path,col):
              return {r['contig']:[float(x) for x in r[col].split(',')] for r in csv.DictReader(path.open(),delimiter='\t') if r.get(col) and r[col]!='.'}
          d=parse(p/'dnaberts_features.tsv','dna_embedding'); g=parse(p/'genomeocean.tsv','embedding')
          def cos(a,b):
              dot=sum(x*y for x,y in zip(a,b)); na=math.sqrt(sum(x*x for x in a)); nb=math.sqrt(sum(y*y for y in b)); return dot/max(1e-12,na*nb)
          def auc(rows):
              pos=[x for x,l,*_ in rows if l]; neg=[x for x,l,*_ in rows if not l]; return sum(1 if x>y else .5 if x==y else 0 for x in pos for y in neg)/max(1,len(pos)*len(neg))
          def med(xs):
              xs=sorted(xs); n=len(xs); return xs[n//2] if n%2 else .5*(xs[n//2-1]+xs[n//2])
          def metric(feats):
              names=sorted(set(feats)&set(truth)); rows=[]
              for i,a in enumerate(names):
                  for b in names[i+1:]: rows.append((cos(feats[a],feats[b]),int(truth[a]==truth[b]),a,b))
              pos=[s for s,l,*_ in rows if l]; neg=[s for s,l,*_ in rows if not l]; hard=[s for s,l,a,b in rows if not l and {truth[a],truth[b]}=={'Escherichia_coli','Salmonella_enterica'}]
              return {'auc':auc(rows),'same_median':med(pos),'different_median':med(neg),'ecoli_salmonella_median':med(hard)},rows
          dm,dr=metric(d); gm,gr=metric(g)
          gmap={(a,b):(s,l) for s,l,a,b in gr}
          # Rank-normalized ensemble: each expert contributes only ordering, not an uncalibrated absolute scale.
          def ranks(rows):
              ordered=sorted(rows,key=lambda x:x[0]); n=max(1,len(ordered)-1); return {(a,b):i/n for i,(_s,_l,a,b) in enumerate(ordered)}
          rd=ranks(dr); rg=ranks(gr); ens=[]
          for s,l,a,b in dr:
              key=(a,b); ens.append((0.5*(rd[key]+rg[key]),l,a,b))
          em={'auc':auc(ens),'same_median':med([s for s,l,*_ in ens if l]),'different_median':med([s for s,l,*_ in ens if not l]),'ecoli_salmonella_median':med([s for s,l,a,b in ens if not l and {truth[a],truth[b]}=={'Escherichia_coli','Salmonella_enterica'}])}
          result={'dnabert_s':dm,'genomeocean_100m':gm,'rank_ensemble':em}; (p/'dna_experts.metrics.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridgebin-v23-dna-experts
          path: benchmark/v23_dna_experts
          retention-days: 14
