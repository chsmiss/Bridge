name: One-shot bubble safety fix

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/one-shot-bubble-fix.yml
      - .github/scripts/apply_bubble_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgeasm-rust-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic fix
        run: python3 .github/scripts/apply_bubble_fix.py
      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require physical support before collapsing bubble alleles"
          git push origin HEAD:codex/bridgeasm-rust-v0
