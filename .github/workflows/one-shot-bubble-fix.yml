name: One-shot bubble safety fix

on:
  push:
    branches:
      - "codex/bridgeasm-rust-v0"
    paths:
      - ".github/workflows/one-shot-bubble-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgeasm-rust-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch and remove one-shot files
        run: |
          git apply .github/patches/bubble-safety.patch
          rm .github/patches/bubble-safety.patch
          rm .github/workflows/one-shot-bubble-fix.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require physical support before collapsing bubble alleles"
          git push origin HEAD:codex/bridgeasm-rust-v0
