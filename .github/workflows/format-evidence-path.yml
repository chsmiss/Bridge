name: Format evidence path source

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/format-evidence-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgeasm-rust-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Patch, validate, and commit Rust source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bin/bridgeasm-evidence-path.rs')
          text = path.read_text()
          marker = '''struct RawLink {\n    source: String,\n    target: String,\n    source_orientation: String,\n    target_orientation: String,\n    overlap: String,\n    tags: Vec<String>,\n}\n'''
          alias = marker + '''\ntype GfaReadResult = (Vec<Segment>, Vec<Link>, FxHashMap<String, usize>, usize);\n'''
          if 'type GfaReadResult =' not in text:
              if marker not in text:
                  raise SystemExit('RawLink marker not found')
              text = text.replace(marker, alias, 1)
          old = 'fn read_gfa(path: &Path) -> Result<(Vec<Segment>, Vec<Link>, FxHashMap<String, usize>, usize)> {'
          new = 'fn read_gfa(path: &Path) -> Result<GfaReadResult> {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('read_gfa signature not found')
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          if git diff --quiet -- src/bin/bridgeasm-evidence-path.rs; then
            echo 'already fixed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/bridgeasm-evidence-path.rs
          git commit -m 'fix: satisfy clippy for evidence path GFA reader'
          git push origin HEAD:codex/bridgeasm-rust-v0
