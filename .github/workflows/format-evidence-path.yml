name: Format evidence path source

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/format-evidence-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgeasm-rust-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit Rust source
        run: |
          cargo fmt --all
          if git diff --quiet -- src/bin/bridgeasm-evidence-path.rs; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/bridgeasm-evidence-path.rs
          git commit -m 'style: format evidence path selector'
          git push origin HEAD:codex/bridgeasm-rust-v0
