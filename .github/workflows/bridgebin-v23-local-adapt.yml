name: BridgeBin v2.3 target-local DNABERT adaptation

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - scripts/bridgebin_local_metric_adapt.py
      - scripts/bridgebin_candidate_pairs.py
      - scripts/bridgebin_requantify.py
      - .github/workflows/bridgebin-v23-local-adapt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-safe DNABERT-S runtime
        run: |
          set -euo pipefail
          cargo build --release --bin bridgebin
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.0,<3'
          python -m pip install 'transformers==4.40.2' einops
          python -m pip uninstall -y triton || true
          curl -L --retry 3 -o /usr/local/bin/datasets \
            'https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets'
          chmod +x /usr/local/bin/datasets
          python -m py_compile scripts/bridgebin_local_metric_adapt.py scripts/bridgebin_requantify.py scripts/bridgebin_candidate_pairs.py

      - name: Train reference-only stage-one identity head
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          root=benchmark/v23_local_adapt/reference_groups
          mkdir -p "$root"
          fetch_group () {
            label="$1"; taxon="$2"; mkdir -p "$root/$label/raw"
            datasets download genome taxon "$taxon" --reference --include genome --no-progressbar --filename "/tmp/${label}.zip"
            unzip -q "/tmp/${label}.zip" -d "$root/$label/raw"
          }
          fetch_group Escherichia_coli 'Escherichia coli'
          fetch_group Salmonella_enterica 'Salmonella enterica'
          fetch_group Klebsiella_pneumoniae 'Klebsiella pneumoniae'
          fetch_group Enterobacter_cloacae 'Enterobacter cloacae'
          fetch_group Citrobacter_freundii 'Citrobacter freundii'
          fetch_group Shigella_flexneri 'Shigella flexneri'
          fetch_group Serratia_marcescens 'Serratia marcescens'
          train=benchmark/v23_local_adapt/train
          python scripts/bridgebin_reference_hardneg_panel.py --input-dir "$root" --output-dir "$train" --fragment-bp 6000 --fragments-per-group 6 --samples 4 --seed 43
          python scripts/bridgebin_dna_embed.py --contigs "$train/contigs.fa" --output "$train/dna.tsv" --model zhihan1996/DNABERT-S --device cpu --window-bp 1600 --stride-bp 1600 --min-window-bp 512 --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py --dna-embeddings "$train/dna.tsv" --output "$train/features.tsv"
          python scripts/bridgebin_make_pair_dataset.py --truth "$train/truth.tsv" --output "$train/pairs.tsv" --anchors-per-genome 6 --positive-per-contig 4 --negative-genomes-per-contig 6 --negative-anchors-per-genome 2
          python scripts/bridgebin_pair_head_bio.py train --features "$train/features.tsv" --pairs "$train/pairs.tsv" --model-out "$train/pair_head.json" --validation-fraction 0.28 --epochs 700 --negative-weight 5 --precision-target 0.99 --require-group-holdout

      - name: Build full Zymo core and truth-free stage-one focus
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          base=benchmark/v23_local_adapt/zymo
          curl -L --retry 3 -o /tmp/zymo-refs.zip 'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python scripts/bridgebin_zymo_reference_benchmark.py --reference-dir /tmp/zymo-species-refs --out "$base" --seed 43 --min-fragment 2200 --max-fragment 8500 --min-contig 1500
          target/release/bridgebin --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" --out-dir "$base/core" --algorithm v2 --v2-core-attraction 0.74 --v2-component-attraction 0.66 --v2-rescue-attraction 0.68 --v2-rescue-margin 0.02
          python scripts/bridgebin_candidate_pairs.py --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" --assignments "$base/core/assignments.tsv" --output "$base/probe_candidates.tsv" --min-length 1500 --anchors-per-bin 12 --anchor-strategy diverse --within-neighbors 4 --within-contrast 4 --merge-bin-neighbors 4 --cross-anchor-pairs 8 --max-pairs 5000 --probe-only
          python scripts/bridgebin_dna_embed.py --contigs "$base/contigs.fa" --pairs "$base/probe_candidates.tsv" --output "$base/probe_dna.tsv" --model zhihan1996/DNABERT-S --device cpu --window-bp 1600 --stride-bp 1600 --min-window-bp 512 --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py --dna-embeddings "$base/probe_dna.tsv" --output "$base/probe_features.tsv"
          python scripts/bridgebin_pair_head_bio.py score --features "$base/probe_features.tsv" --pairs "$base/probe_candidates.tsv" --model benchmark/v23_local_adapt/train/pair_head.json --output "$base/probe_scores.tsv" --model-name ref-hardneg-dnaberts-bio
          python scripts/bridgebin_local_anchor_partition.py --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" --assignments "$base/core/assignments.tsv" --candidates "$base/probe_candidates.tsv" --scores "$base/probe_scores.tsv" --output "$base/stage1_assignments.tsv" --report "$base/stage1_report.json" --min-side-anchors 1 --min-gap 0.035 --max-permutation-p 0.05 --min-coverage-gap 0 --permutations 96 --seed 43
          python scripts/bridgebin_bio_focus_bins.py --report "$base/stage1_report.json" --output "$base/focus_bins.tsv" --min-dna-gap 0.035 --max-permutation-p 0.05 --min-coverage-gap 0.03 --singleton-min-coverage-gap 0.05

      - name: Embed only focused-bin members
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          base=benchmark/v23_local_adapt/zymo
          python scripts/bridgebin_candidate_pairs.py --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" --assignments "$base/core/assignments.tsv" --output "$base/member_candidates.tsv" --min-length 1500 --anchors-per-bin 12 --anchor-strategy diverse --within-neighbors 12 --within-contrast 0 --merge-bin-neighbors 0 --cross-anchor-pairs 0 --rescue-bin-neighbors 0 --rescue-anchor-pairs 0 --focus-bins "$base/focus_bins.tsv" --skip-residual-rescue --max-pairs 25000
          python scripts/bridgebin_dna_embed.py --contigs "$base/contigs.fa" --pairs "$base/member_candidates.tsv" --output "$base/member_dna.tsv" --model zhihan1996/DNABERT-S --device cpu --window-bp 1600 --stride-bp 1600 --min-window-bp 512 --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py --dna-embeddings "$base/member_dna.tsv" --output "$base/member_features.tsv"

      - name: Compare raw target prototypes versus local metric adaptation
        run: |
          set -euo pipefail
          base=benchmark/v23_local_adapt/zymo
          for spec in raw:0:0 adapted0:0.30:0 adapted005:0.30:0.005 adapted01:0.30:0.01 adapted02:0.30:0.02; do
            name=${spec%%:*}; rest=${spec#*:}; scale=${rest%%:*}; margin=${rest##*:}
            out="$base/$name"; mkdir -p "$out"
            python scripts/bridgebin_local_metric_adapt.py --features "$base/member_features.tsv" --assignments "$base/core/assignments.tsv" --stage1-report "$base/stage1_report.json" --focus-bins "$base/focus_bins.tsv" --output "$out/assignments.tsv" --report "$out/local_report.json" --rank 32 --epochs 250 --learning-rate 0.005 --negative-margin 0.20 --negative-weight 5 --drift-weight 0.15 --residual-scale "$scale" --member-margin "$margin" --seed 43
            python scripts/bridgebin_requantify.py --assignments "$out/assignments.tsv" --coverage "$base/coverage.tsv" --truth-lengths "$base/truth.tsv" --output "$out/abundance.tsv"
            python scripts/bridgebin_benchmark.py evaluate --truth "$base/truth.tsv" --truth-abundance "$base/truth_abundance.tsv" --assignments "$out/assignments.tsv" --abundance "$out/abundance.tsv" --output "$out/metrics.json" >/dev/null
          done
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('benchmark/v23_local_adapt/zymo')
          core=json.loads((b/'core.metrics.json').read_text()) if (b/'core.metrics.json').exists() else None
          print('mode\tbins\tpurity\trecall\tf1\tari\thq\tbinned')
          if core: print('core',core)
          for name in ['raw','adapted0','adapted005','adapted01','adapted02']:
              m=json.loads((b/name/'metrics.json').read_text())
              print(f"{name}\t{m['predicted_bins']}\t{m['weighted_purity']:.6f}\t{m['bp_recall']:.6f}\t{m['f1']:.6f}\t{m['ari']:.6f}\t{m['hq_like_genomes_90_95']}\t{m['bp_binned_fraction']:.6f}")
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgebin-v23-local-adapt
          path: benchmark/v23_local_adapt
          retention-days: 14
