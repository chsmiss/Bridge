name: Zymo 200k Stage17 frontier recovery

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage17-frontier-200k.yml
      - scripts/stage17_frontier_recovery.py
      - scripts/stage17_breakpoint_oracle.py
      - scripts/test_stage17_frontier_recovery.py
      - scripts/test_stage17_breakpoint_oracle.py
      - scripts/stage16_root_cause.py
      - scripts/stage15_structural_recovery.py
      - scripts/stage14_amplified_methods.py
      - scripts/stage10_multik_rescue.py
      - scripts/stage8_backbone_optimizer.py
      - scripts/stage789_optimizer.py
      - scripts/graph_path_phaser.py
      - scripts/repeat_graph_optimizer.py
      - scripts/low_abundance_rescue.py
      - src/**
  workflow_dispatch:

concurrency:
  group: zymo-stage17-frontier-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install evaluation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/stage14_amplified_methods.py \
            scripts/stage15_structural_recovery.py \
            scripts/stage16_root_cause.py \
            scripts/stage17_frontier_recovery.py \
            scripts/stage17_breakpoint_oracle.py \
            scripts/test_stage17_frontier_recovery.py \
            scripts/test_stage17_breakpoint_oracle.py
          PYTHONPATH=scripts python3 scripts/test_stage16_root_cause.py
          PYTHONPATH=scripts python3 scripts/test_stage17_frontier_recovery.py
          PYTHONPATH=scripts python3 scripts/test_stage17_breakpoint_oracle.py
          cargo build --release

      - name: Build fixed Stage8 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
            --pipeline-dir benchmark/bridge_repeat \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --segment-anchor-bases 31 \
            --lookahead-depth 3 \
            --lookahead-max-branch 4

      - name: Build Stage10 strict baseline
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage10.time.txt \
            python3 scripts/stage10_multik_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" --ks 17,21,25,31
          cp benchmark/bridge_repeat/stage10_multik_rescue/candidate_multik_strict/primary_contigs.fasta \
             benchmark/assemblies/bridge_stage10_strict.fasta

      - name: Run Stage17 mechanism repairs
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage17.time.txt \
            python3 scripts/stage17_frontier_recovery.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS"
          root=benchmark/bridge_repeat/stage17_frontier_recovery
          cp "$root/hybrid_thread/candidate_hybrid_thread/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage17_hybrid_thread.fasta
          cp "$root/frontier_local/candidate_frontier_local/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage17_frontier_local.fasta
          cp "$root/combined/candidate_combined/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage17_combined.fasta

      - name: Summarize Stage17 mechanisms
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark/bridge_repeat/stage17_frontier_recovery')
          s=json.loads((root/'stage17_stats.json').read_text())
          h=s['methods']['hybrid_thread']
          t=h['threading']
          r=s['methods']['frontier_local']
          rows=[]
          def add(k,v): rows.append((k,v))
          for key in ('reads','exact_threaded_reads','exact_segments','exact_contexts',
                      'k19_indexed_reads','k19_ambiguous_reads','k19_threaded_reads',
                      'k19_graph_bridge_reads','k15_indexed_reads','k15_ambiguous_reads',
                      'k15_threaded_reads','k15_graph_bridge_reads','fallback_contexts',
                      'fallback_context_weight','hybrid_contexts','unthreaded_after_all'):
              add('thread_'+key, t.get(key,0))
          for key in ('selected_records','selected_bases','selected_fresh31'):
              add('hybrid_'+key, h.get(key,0))
          for key in ('input_seed_records','signature_eligible_seeds','total_library_pairs',
                      'initial_pairs','total_recruited_pairs','recruited_library_fraction',
                      'seeds_with_recruited_pairs','evidence_records','selected_records',
                      'selected_seed_loci','selected_bases','selected_fresh31'):
              add('frontier_'+key, r.get(key,0))
          for rr in r.get('frontier_rounds',[]):
              rid=rr['round']
              for key in ('k','frontier_signatures','new_pairs','ambiguous_rejects','total_pairs'):
                  add(f'frontier_round{rid}_{key}', rr.get(key,0))
          with Path('benchmark/stage17_diagnostics.tsv').open('w') as out:
              out.write('metric\tvalue\n')
              for key,value in rows:
                  out.write(f'{key}\t{value}\n')
          print(Path('benchmark/stage17_diagnostics.tsv').read_text())
          PY

      - name: Run breakpoint oracle on Stage10
        run: |
          set -euo pipefail
          minimap2 -x asm5 --secondary=yes /tmp/zymo-references.fasta \
            benchmark/assemblies/bridge_stage10_strict.fasta \
            > benchmark/stage10_vs_reference.paf
          python3 scripts/stage17_breakpoint_oracle.py \
            --reference-dir /tmp/zymo-species-refs \
            --paf benchmark/stage10_vs_reference.paf \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --k21-gfa benchmark/bridge_repeat/current_pipeline/iterative/k21_recall/assembly.gfa \
            --k31-gfa benchmark/bridge_repeat/current_pipeline/iterative/k31_resolve/assembly.gfa \
            --baseline benchmark/assemblies/bridge_stage10_strict.fasta \
            --output-prefix benchmark/stage10_breakpoint_oracle

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage10_strict.fasta \
            benchmark/assemblies/bridge_stage17_hybrid_thread.fasta \
            benchmark/assemblies/bridge_stage17_frontier_local.fasta \
            benchmark/assemblies/bridge_stage17_combined.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage10_strict.fasta benchmark/assemblies/bridge_stage17_hybrid_thread.fasta benchmark/assemblies/bridge_stage17_frontier_local.fasta benchmark/assemblies/bridge_stage17_combined.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Compare Stage17 without metric gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open() as h: return list(csv.DictReader(h, delimiter='\t'))
          meta={r['Assembly']:r for r in rows('benchmark/metaquast_summary.tsv')}
          species={r['assembly']:r for r in rows('benchmark/species_summary.tsv')}
          baseline='bridge_stage10_strict'
          names=['bridge_stage10_strict','bridge_stage17_hybrid_thread',
                 'bridge_stage17_frontier_local','bridge_stage17_combined']
          b=meta[baseline]; bs=species[baseline]
          bgf=float(bs['bacteria_mean_gf']); bps=float(bs['pseudomonas_gf']); bna=float(b['NA50'])
          with Path('benchmark/stage17_comparison.tsv').open('w') as out:
              out.write('assembly\tmean_gf\tdelta_mean_gf\tpseudomonas_gf\tdelta_pseudomonas\tcombined_gf\tna50\tdelta_na50\tdup\tmisassemblies\tlocal_misassemblies\n')
              for name in names:
                  m=meta[name]; sp=species[name]
                  gf=float(sp['bacteria_mean_gf']); ps=float(sp['pseudomonas_gf']); na=float(m['NA50'])
                  out.write(f'{name}\t{gf:.4f}\t{gf-bgf:+.4f}\t{ps:.4f}\t{ps-bps:+.4f}\t{m["Genome fraction (%)"]}\t{na:.1f}\t{na-bna:+.1f}\t{float(m["Duplication ratio"]):.4f}\t{int(float(m["# misassemblies"]))}\t{int(float(m["# local misassemblies"]))}\n')
          print(Path('benchmark/stage17_comparison.tsv').read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nbaseline\tStage10_strict\nselection_policy\troot_cause_no_metric_targets\nhybrid_thread\texact_k31_then_fallback_k19_k15_add_only\nfrontier_local\titerative_locus_unique_mate_frontier\noracle\treference_only_posthoc_stage_loss_classifier\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage17-frontier-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/*.paf
            benchmark/bridge_repeat/stage17_frontier_recovery/stage17_stats.json
            benchmark/bridge_repeat/stage17_frontier_recovery/hybrid_thread/*.tsv
            benchmark/bridge_repeat/stage17_frontier_recovery/frontier_local/*.tsv
