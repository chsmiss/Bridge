name: Zymo Log 500k mid-k sweep

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Number of ERR2935805 read pairs
        required: false
        default: "500000"
  pull_request:
    paths:
      - .github/workflows/zymo-midk-500k-sweep.yml
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-midk-500k-sweep.yml

concurrency:
  group: zymo-midk-500k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAIRS: ${{ inputs.pairs || '500000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit curl unzip minimap2
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp
      - name: Download deterministic reads and references
        run: |
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          test -s /tmp/zymo-references.fasta
      - name: Build BridgeAsm
        run: cargo build --release
      - name: Run focused k and emission sweep
        run: |
          run_bridgeasm() {
            name=$1
            k=$2
            mercy=$3
            min_read=$4
            min_primary=$5
            dominance=$6
            mkdir -p "benchmark/$name"
            /usr/bin/time -v -o "benchmark/$name.time.txt" \
              target/release/bridgeasm assemble \
                -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                -o "benchmark/$name" -k "$k" \
                --min-count 2 --mercy-max-kmers "$mercy" \
                --mercy-min-support 1 --mercy-min-quality 25 \
                --min-read-support "$min_read" --min-pair-support 2 \
                --min-primary-support "$min_primary" \
                --primary-dominance "$dominance" \
                --min-contig-length 200 --threads 2
            cp "benchmark/$name/primary_contigs.fasta" \
              "benchmark/assemblies/$name-primary.fasta"
            python3 scripts/merge_fasta_unique.py \
              "benchmark/assemblies/$name-all-exact.fasta" \
              "benchmark/$name/primary_contigs.fasta" \
              "benchmark/$name/unitigs.fasta" \
              "benchmark/$name/haplotigs.fasta" \
              --min-length 200
          }

          # Dense medium-k sweep around the region that retained both recovery
          # and continuity in the first 500k experiment.
          run_bridgeasm k19-base 19 32 2 5 0.75
          run_bridgeasm k21-base 21 24 2 5 0.75
          run_bridgeasm k23-base 23 24 2 5 0.75
          run_bridgeasm k25-base 25 24 2 5 0.75
          run_bridgeasm k27-base 27 20 2 5 0.75
          run_bridgeasm k29-base 29 20 2 5 0.75
          run_bridgeasm k31-base 31 16 2 5 0.75
          run_bridgeasm k35-base 35 12 2 5 0.75
          run_bridgeasm k39-base 39 10 2 5 0.75
          run_bridgeasm k41-base 41 8 2 5 0.75
          run_bridgeasm k47-base 47 6 2 5 0.75
          run_bridgeasm k51-base 51 4 2 5 0.75

          # Targeted recall variants. They remain separate candidates until
          # MetaQUAST establishes their structural-error cost.
          run_bridgeasm k21-long-mercy 21 64 2 5 0.75
          run_bridgeasm k29-relaxed 29 48 1 3 0.60
          run_bridgeasm k31-relaxed 31 48 1 3 0.60
      - name: Build exact cross-k unions
        run: |
          base_names="k19-base k21-base k23-base k25-base k27-base k29-base k31-base k35-base k39-base k41-base k47-base k51-base"
          all_names="$base_names k21-long-mercy k29-relaxed k31-relaxed"

          primary_inputs=""
          exact_inputs=""
          for name in $base_names; do
            primary_inputs="$primary_inputs benchmark/assemblies/$name-primary.fasta"
            exact_inputs="$exact_inputs benchmark/assemblies/$name-all-exact.fasta"
          done
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/midk-base-primary-union.fasta \
            $primary_inputs --min-length 200
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/midk-base-exact-union.fasta \
            $exact_inputs --min-length 200

          all_exact_inputs=""
          for name in $all_names; do
            all_exact_inputs="$all_exact_inputs benchmark/assemblies/$name-all-exact.fasta"
          done
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/midk-all-exact-union.fasta \
            $all_exact_inputs --min-length 200

          for fasta in benchmark/assemblies/*.fasta; do
            base=$(basename "$fasta" .fasta)
            python3 scripts/fasta_stats.py "$fasta" \
              --json "benchmark/$base.stats.json" \
              > "benchmark/$base.stats.tsv"
          done
      - name: Run MEGAHIT
        run: |
          /usr/bin/time -v -o benchmark/megahit.time.txt \
            megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              -o benchmark/megahit --min-contig-len 200 -t 2
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
          python3 scripts/fasta_stats.py benchmark/megahit/final.contigs.fa \
            --json benchmark/megahit.stats.json > benchmark/megahit.stats.tsv
      - name: Run MetaQUAST
        run: |
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/k19-base-primary.fasta \
            benchmark/assemblies/k21-base-primary.fasta \
            benchmark/assemblies/k23-base-primary.fasta \
            benchmark/assemblies/k25-base-primary.fasta \
            benchmark/assemblies/k27-base-primary.fasta \
            benchmark/assemblies/k29-base-primary.fasta \
            benchmark/assemblies/k31-base-primary.fasta \
            benchmark/assemblies/k35-base-primary.fasta \
            benchmark/assemblies/k39-base-primary.fasta \
            benchmark/assemblies/k41-base-primary.fasta \
            benchmark/assemblies/k47-base-primary.fasta \
            benchmark/assemblies/k51-base-primary.fasta \
            benchmark/assemblies/k21-long-mercy-primary.fasta \
            benchmark/assemblies/k29-relaxed-primary.fasta \
            benchmark/assemblies/k31-relaxed-primary.fasta \
            benchmark/assemblies/midk-base-primary-union.fasta \
            benchmark/assemblies/midk-base-exact-union.fasta \
            benchmark/assemblies/midk-all-exact-union.fasta \
            benchmark/assemblies/megahit.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads 2 --min-contig 200 --no-plots
      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nbase_k_values\t19,21,23,25,27,29,31,35,39,41,47,51\n' \
            "$GITHUB_SHA" "$PAIRS" > benchmark/benchmark_provenance.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: zymo-log-midk-500k-sweep
          path: benchmark
          retention-days: 14
