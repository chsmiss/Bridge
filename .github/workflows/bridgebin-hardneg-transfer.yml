name: BridgeBin hard-negative transfer probe

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - scripts/bridgebin_reference_hardneg_panel.py
      - scripts/bridgebin_eval_pair_scores.py
      - scripts/bridgebin_pair_head.py
      - scripts/bridgebin_dna_embed.py
      - .github/workflows/bridgebin-hardneg-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-safe DNABERT-S and NCBI Datasets
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.0,<3'
          python -m pip install 'transformers==4.40.2' einops
          python -m pip uninstall -y triton || true
          curl -L --retry 3 -o /usr/local/bin/datasets \
            'https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets'
          chmod +x /usr/local/bin/datasets
          datasets version

      - name: Download Enterobacterales reference curriculum
        run: |
          set -euo pipefail
          root=benchmark/hardneg_transfer/reference_groups
          mkdir -p "$root"
          fetch_group () {
            label="$1"; taxon="$2"
            mkdir -p "$root/$label/raw"
            datasets download genome taxon "$taxon" --reference --include genome \
              --no-progressbar --filename "/tmp/${label}.zip"
            unzip -q "/tmp/${label}.zip" -d "$root/$label/raw"
          }
          fetch_group Escherichia_coli 'Escherichia coli'
          fetch_group Salmonella_enterica 'Salmonella enterica'
          fetch_group Klebsiella_pneumoniae 'Klebsiella pneumoniae'
          fetch_group Enterobacter_cloacae 'Enterobacter cloacae'
          fetch_group Citrobacter_freundii 'Citrobacter freundii'
          fetch_group Shigella_flexneri 'Shigella flexneri'
          fetch_group Serratia_marcescens 'Serratia marcescens'

          python scripts/bridgebin_reference_hardneg_panel.py \
            --input-dir "$root" --output-dir benchmark/hardneg_transfer/train \
            --fragment-bp 6000 --fragments-per-group 6 --samples 4 --seed 43

      - name: Embed reference curriculum and train DNA-only head
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          b=benchmark/hardneg_transfer/train
          python scripts/bridgebin_dna_embed.py \
            --contigs "$b/contigs.fa" --output "$b/dnaberts_windows.tsv" \
            --model zhihan1996/DNABERT-S --device cpu \
            --window-bp 1600 --stride-bp 1600 --min-window-bp 512 \
            --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py \
            --dna-embeddings "$b/dnaberts_windows.tsv" --output "$b/features.tsv"
          # Deliberately omit coverage from the pair table. The curriculum is testing
          # transferable DNA identity; abundance will be fused later by the production
          # candidate graph rather than allowed to distort this calibration.
          python scripts/bridgebin_make_pair_dataset.py \
            --truth "$b/truth.tsv" --output "$b/pairs.tsv" \
            --anchors-per-genome 6 --positive-per-contig 4 \
            --negative-genomes-per-contig 6 --negative-anchors-per-genome 2
          python scripts/bridgebin_pair_head.py train \
            --features "$b/features.tsv" --pairs "$b/pairs.tsv" --model-out "$b/pair_head.json" \
            --validation-fraction 0.28 --epochs 700 --negative-weight 5 \
            --precision-target 0.99 --require-group-holdout \
            | tee "$b/pair_head.metrics.jsonl"

      - name: Prepare independent Zymo hard panel
        run: |
          set -euo pipefail
          b=benchmark/hardneg_transfer/zymo
          mkdir -p "$b"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python scripts/bridgebin_zymo_reference_benchmark.py \
            --reference-dir /tmp/zymo-species-refs --out "$b/full" \
            --seed 43 --min-fragment 2200 --max-fragment 8500 --min-contig 1500
          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path
          src=Path('benchmark/hardneg_transfer/zymo/full')
          out=Path('benchmark/hardneg_transfer/zymo/panel'); out.mkdir(parents=True,exist_ok=True)
          truth=list(csv.DictReader((src/'truth.tsv').open(),delimiter='\t'))
          groups=defaultdict(list)
          for row in truth:
              if int(row['eligible']): groups[row['genome']].append(row)
          chosen=[]
          for genome,rows in sorted(groups.items()):
              rows.sort(key=lambda x:(-int(x['length']),x['contig']))
              chosen.extend(rows[:4])
          ids={x['contig'] for x in chosen}
          seq={}; name=None; chunks=[]
          for raw in (src/'contigs.fa').read_text().splitlines():
              if raw.startswith('>'):
                  if name is not None: seq[name]=''.join(chunks)
                  name=raw[1:].split()[0]; chunks=[]
              else: chunks.append(raw.strip())
          if name is not None: seq[name]=''.join(chunks)
          with (out/'contigs.fa').open('w') as h:
              for cid in sorted(ids):
                  h.write(f'>{cid}\n'); s=seq[cid]
                  for i in range(0,len(s),80): h.write(s[i:i+80]+'\n')
          fields=['contig','genome','length','eligible','record','start','end']
          with (out/'truth.tsv').open('w',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields,delimiter='\t'); w.writeheader(); w.writerows(sorted(chosen,key=lambda x:x['contig']))
          with (src/'coverage.tsv').open() as a,(out/'coverage.tsv').open('w',newline='') as z:
              r=csv.reader(a,delimiter='\t'); w=csv.writer(z,delimiter='\t',lineterminator='\n'); w.writerow(next(r))
              for row in r:
                  if row and row[0] in ids: w.writerow(row)
          print('zymo_panel',len(ids),'genomes',len(groups))
          PY

      - name: Zero-shot score Zymo with reference-trained DNA head
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          train=benchmark/hardneg_transfer/train
          z=benchmark/hardneg_transfer/zymo/panel
          python scripts/bridgebin_dna_embed.py \
            --contigs "$z/contigs.fa" --output "$z/dnaberts_windows.tsv" \
            --model zhihan1996/DNABERT-S --device cpu \
            --window-bp 1600 --stride-bp 1600 --min-window-bp 512 \
            --max-windows-per-contig 2 --max-tokens 384 --batch-size 4
          python scripts/bridgebin_bio_features.py \
            --dna-embeddings "$z/dnaberts_windows.tsv" --output "$z/features.tsv"
          # Keep coverage in the evaluation pair file: the trained DNA-only model has a
          # zero coverage weight, so this also checks missing-modality robustness.
          python scripts/bridgebin_make_pair_dataset.py \
            --truth "$z/truth.tsv" --coverage "$z/coverage.tsv" --output "$z/pairs.tsv" \
            --anchors-per-genome 4 --positive-per-contig 3 \
            --negative-genomes-per-contig 7 --negative-anchors-per-genome 2
          python scripts/bridgebin_pair_head.py score \
            --features "$z/features.tsv" --pairs "$z/pairs.tsv" \
            --model "$train/pair_head.json" --output "$z/pair_scores.tsv" \
            --model-name ref-hardneg-dnaberts-dna-only
          python - <<'PY'
          import json
          from pathlib import Path
          model=json.loads(Path('benchmark/hardneg_transfer/train/pair_head.json').read_text())
          tr=model['training']
          print('reference_calibration',json.dumps({
              'validation_groups':tr['validation_groups'],
              'join':tr['recommended_join_min_same'],
              'split':tr['recommended_split_max_same'],
              'at_0_5':tr['validation_at_0_5'],
              'weights':tr['learned_similarity_weights'],
          },sort_keys=True))
          Path('/tmp/thresholds').write_text(f"{tr['recommended_join_min_same']}\n{tr['recommended_split_max_same']}\n")
          PY
          join=$(sed -n '1p' /tmp/thresholds)
          split=$(sed -n '2p' /tmp/thresholds)
          python scripts/bridgebin_eval_pair_scores.py \
            --pairs "$z/pairs.tsv" --scores "$z/pair_scores.tsv" \
            --join-threshold "$join" --split-threshold "$split" \
            --focus Escherichia_coli,Salmonella_enterica \
            --output "$z/transfer.metrics.json"
          cat "$z/transfer.metrics.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgebin-hardneg-transfer
          path: benchmark/hardneg_transfer
          retention-days: 14
