name: BridgeBin one-off clippy fix

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - .github/workflows/bridgebin-oneoff-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgebin-v2-signed-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact clippy cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bridgebin_v21.rs')
          s=p.read_text()
          old='''        match (new_bin_of[a], new_bin_of[b]) {\n            (Some(left_bin), Some(right_bin)) if left_bin == right_bin => false,\n            _ => true,\n        }\n'''
          new='''        !matches!(\n            (new_bin_of[a], new_bin_of[b]),\n            (Some(left_bin), Some(right_bin)) if left_bin == right_bin\n        )\n'''
          if old not in s:
              raise SystemExit('expected match expression not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridgebin_v21.rs
          git commit -m 'style(bridgebin): satisfy signed-cut clippy lint'
          git push origin HEAD:codex/bridgebin-v2-signed-evidence
