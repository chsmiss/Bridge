name: Apply rustfmt once

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/apply-rustfmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit source
        run: |
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assembler.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: apply rustfmt to path-cover implementation'
          git push origin HEAD:codex/bridgeasm-rust-v0
