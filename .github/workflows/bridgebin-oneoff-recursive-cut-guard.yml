name: BridgeBin one-off recursive cut guard

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - .github/workflows/bridgebin-oneoff-recursive-cut-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgebin-v2-signed-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Require stronger recursive model-only split evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bridgebin_v21.rs')
          s=p.read_text()
          old='''    if !accept_cut(&candidate, cfg) {\n        return vec![members.to_vec()];\n    }\n\n    let mut pieces = recursive_signed_partition(\n'''
          new='''    // A second model-only cut needs stronger support than the first split. This prevents\n    // a few calibration false negatives from recursively fragmenting a coherent genome,\n    // while marker conflicts remain strict at every depth.\n    if depth > 0\n        && candidate.cut_marker_hard == 0\n        && candidate.cut_model_hard < cfg.min_pair_support.max(3)\n    {\n        return vec![members.to_vec()];\n    }\n    if !accept_cut(&candidate, cfg) {\n        return vec![members.to_vec()];\n    }\n\n    let mut pieces = recursive_signed_partition(\n'''
          if old not in s:
              raise SystemExit('recursive accept block not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridgebin_v21.rs
          git commit -m 'fix(bridgebin): guard recursive model-only conflict cuts'
          git push origin HEAD:codex/bridgebin-v2-signed-evidence
