name: BridgeBin one-off type fix

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - .github/workflows/bridgebin-oneoff-type-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgebin-v2-signed-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact type annotation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/bridgebin_v21.rs')
          s=p.read_text()
          old='        let mut best_member = None;\n'
          new='        let mut best_member: Option<usize> = None;\n'
          if old not in s:
              raise SystemExit('expected line not found')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridgebin_v21.rs
          git commit -m 'fix(bridgebin): annotate signed-cut member type'
          git push origin HEAD:codex/bridgebin-v2-signed-evidence
