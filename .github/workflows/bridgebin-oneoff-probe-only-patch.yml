name: BridgeBin one-off probe-only candidate patch

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - .github/workflows/bridgebin-oneoff-probe-only-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgebin-v2-signed-evidence
      - name: Add anchor-only probe mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/bridgebin_candidate_pairs.py')
          s=p.read_text()
          old='''    parser.add_argument("--max-pairs", type=int, default=250000)\n    return parser.parse_args(argv)\n'''
          new='''    parser.add_argument("--max-pairs", type=int, default=250000)\n    parser.add_argument(\n        "--probe-only",\n        action="store_true",\n        help=(\n            "emit only anchor-level within-bin and cross-bin pairs; skip member expansion "\n            "and residual rescue for a cheap first-pass conflict probe"\n        ),\n    )\n    return parser.parse_args(argv)\n'''
          if old not in s:
              raise SystemExit('parser insertion point not found')
          s=s.replace(old,new,1)
          old='''        for member in members:\n            ranked = ranked_anchors(member, bin_anchors)\n            for _score, anchor in ranked[: args.within_neighbors]:\n                add_pair(records, member, anchor, "within_bin_neighbor")\n            if args.within_contrast > 0:\n                for _score, anchor in ranked[-args.within_contrast :]:\n                    add_pair(records, member, anchor, "within_bin_contrast")\n'''
          new='''        if not args.probe_only:\n            for member in members:\n                ranked = ranked_anchors(member, bin_anchors)\n                for _score, anchor in ranked[: args.within_neighbors]:\n                    add_pair(records, member, anchor, "within_bin_neighbor")\n                if args.within_contrast > 0:\n                    for _score, anchor in ranked[-args.within_contrast :]:\n                        add_pair(records, member, anchor, "within_bin_contrast")\n'''
          if old not in s:
              raise SystemExit('within-member block not found')
          s=s.replace(old,new,1)
          old='''    # Unbinned contigs only query their nearest few bin centroids and nearest anchors.\n    for residual in sorted(residuals, key=lambda feature: (-feature.length, feature.contig)):\n        neighbor_bins = [\n            (cheap_similarity(residual, center), bin_name)\n            for bin_name, center in centroids.items()\n        ]\n        neighbor_bins.sort(key=lambda item: (-item[0], item[1]))\n        for _bin_score, bin_name in neighbor_bins[: args.rescue_bin_neighbors]:\n            ranked = ranked_anchors(residual, anchors.get(bin_name, []))\n            for _score, anchor in ranked[: args.rescue_anchor_pairs]:\n                add_pair(records, residual, anchor, "residual_rescue")\n'''
          new='''    # Residual rescue is deferred until after the anchor conflict probe.  This keeps the\n    # first-pass foundation-model endpoint set proportional to bin anchors, not all contigs.\n    if not args.probe_only:\n        for residual in sorted(residuals, key=lambda feature: (-feature.length, feature.contig)):\n            neighbor_bins = [\n                (cheap_similarity(residual, center), bin_name)\n                for bin_name, center in centroids.items()\n            ]\n            neighbor_bins.sort(key=lambda item: (-item[0], item[1]))\n            for _bin_score, bin_name in neighbor_bins[: args.rescue_bin_neighbors]:\n                ranked = ranked_anchors(residual, anchors.get(bin_name, []))\n                for _score, anchor in ranked[: args.rescue_anchor_pairs]:\n                    add_pair(records, residual, anchor, "residual_rescue")\n'''
          if old not in s:
              raise SystemExit('residual block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/bridgebin_candidate_pairs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bridgebin_candidate_pairs.py
          git commit -m 'feat(bridgebin): add anchor-only biological probe candidates'
          git push origin HEAD:codex/bridgebin-v2-signed-evidence
