name: Zymo 200k Stage12 variant guard

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage12-variant-200k.yml
      - scripts/variant_linkage.py
      - scripts/test_variant_linkage.py
      - scripts/stage12_variant_guard.py
  workflow_dispatch:

concurrency:
  group: zymo-stage12-variant-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spades curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/repeat_graph_optimizer_v2.py \
            scripts/na50_repeat_pipeline.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/stage11_aggressive_rescue.py \
            scripts/fill_scaffold_gaps_multik.py \
            scripts/variant_linkage.py \
            scripts/stage12_variant_guard.py \
            scripts/test_variant_linkage.py
          PYTHONPATH=scripts python3 scripts/test_stage789_optimizer.py
          PYTHONPATH=scripts python3 scripts/test_low_abundance_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage10_multik_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage11_aggressive.py
          PYTHONPATH=scripts python3 scripts/test_variant_linkage.py
          cargo build --release

      - name: Build fixed Stage8 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --segment-anchor-bases 31 \
              --lookahead-depth 3 \
              --lookahead-max-branch 4

      - name: Build Stage11 exploration context
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage11.time.txt \
            python3 scripts/stage11_aggressive_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" \
              --ks 15,17,21,25,31

      - name: Run Stage12 variant-coherence guard
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage12.time.txt \
            python3 scripts/stage12_variant_guard.py \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" \
              --marker-k 21
          cp benchmark/bridge_repeat/bridge_backbone.fasta benchmark/assemblies/bridge_stage8_backbone.fasta
          cp benchmark/bridge_repeat/stage11_flow_aggressive.fasta benchmark/assemblies/bridge_stage11_flow.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_localfill/primary_contigs.fasta benchmark/assemblies/bridge_stage11_flow_localfill.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_rare_consensus/primary_contigs.fasta benchmark/assemblies/bridge_stage11_flow_rare.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_rare_localfill/primary_contigs.fasta benchmark/assemblies/bridge_stage11_flow_rare_localfill.fasta
          cp benchmark/bridge_repeat/stage12_variant_guard_flow.fasta benchmark/assemblies/bridge_stage12_variant_flow.fasta
          cp benchmark/bridge_repeat/stage12_variant_guard/candidate_variant_flow_localfill/primary_contigs.fasta benchmark/assemblies/bridge_stage12_variant_flow_localfill.fasta
          cp benchmark/bridge_repeat/stage12_variant_guard/candidate_variant_flow_rare/primary_contigs.fasta benchmark/assemblies/bridge_stage12_variant_flow_rare.fasta
          cp benchmark/bridge_repeat/stage12_variant_guard/candidate_variant_flow_rare_localfill/primary_contigs.fasta benchmark/assemblies/bridge_stage12_variant_flow_rare_localfill.fasta

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/bridge_*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage8_backbone.fasta \
            benchmark/assemblies/bridge_stage11_flow.fasta \
            benchmark/assemblies/bridge_stage11_flow_localfill.fasta \
            benchmark/assemblies/bridge_stage11_flow_rare.fasta \
            benchmark/assemblies/bridge_stage11_flow_rare_localfill.fasta \
            benchmark/assemblies/bridge_stage12_variant_flow.fasta \
            benchmark/assemblies/bridge_stage12_variant_flow_localfill.fasta \
            benchmark/assemblies/bridge_stage12_variant_flow_rare.fasta \
            benchmark/assemblies/bridge_stage12_variant_flow_rare_localfill.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json \
            | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage8_backbone.fasta benchmark/assemblies/bridge_stage11_flow.fasta benchmark/assemblies/bridge_stage11_flow_localfill.fasta benchmark/assemblies/bridge_stage11_flow_rare.fasta benchmark/assemblies/bridge_stage11_flow_rare_localfill.fasta benchmark/assemblies/bridge_stage12_variant_flow.fasta benchmark/assemblies/bridge_stage12_variant_flow_localfill.fasta benchmark/assemblies/bridge_stage12_variant_flow_rare.fasta benchmark/assemblies/bridge_stage12_variant_flow_rare_localfill.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Score variant guard deltas and promotion gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open() as handle:
                  return list(csv.DictReader(handle, delimiter='\t'))

          meta = {r['Assembly']: r for r in rows('benchmark/metaquast_summary.tsv')}
          species = {r['assembly']: r for r in rows('benchmark/species_summary.tsv')}
          baseline = 'bridge_stage8_backbone'
          comparisons = {
              'bridge_stage12_variant_flow': 'bridge_stage11_flow',
              'bridge_stage12_variant_flow_localfill': 'bridge_stage11_flow_localfill',
              'bridge_stage12_variant_flow_rare': 'bridge_stage11_flow_rare',
              'bridge_stage12_variant_flow_rare_localfill': 'bridge_stage11_flow_rare_localfill',
          }
          b = meta[baseline]
          bgf = float(species[baseline]['bacteria_mean_gf'])
          bna = float(b['NA50'])
          out = Path('benchmark/stage12_gate.tsv')
          with out.open('w') as handle:
              handle.write('assembly\tcomparator\tmean_gf\tmean_gf_vs_stage8\tmean_gf_vs_stage11\tpseudomonas_gf\tcombined_gf\tna50\tna50_vs_stage8\tna50_vs_stage11\tdup\tmisassemblies\tmis_delta_vs_stage11\tlocal_misassemblies\tlocal_delta_vs_stage11\tstrict_gate\texploratory_gate\n')
              for name, comparator in comparisons.items():
                  m = meta[name]; c = meta[comparator]
                  s = species[name]; cs = species[comparator]
                  mean_gf = float(s['bacteria_mean_gf']); cgf = float(cs['bacteria_mean_gf'])
                  na50 = float(m['NA50']); cna = float(c['NA50'])
                  dup = float(m['Duplication ratio'])
                  mis = int(float(m['# misassemblies'])); cmis = int(float(c['# misassemblies']))
                  local = int(float(m['# local misassemblies'])); clocal = int(float(c['# local misassemblies']))
                  strict = dup <= 1.008 and mis <= 12 and local <= 6 and mean_gf >= bgf and na50 >= 0.95*bna
                  explore = dup <= 1.015 and mis <= 16 and local <= 10 and (mean_gf >= bgf + 0.05 or na50 >= 1.10*bna)
                  handle.write(
                      f'{name}\t{comparator}\t{mean_gf:.4f}\t{mean_gf-bgf:+.4f}\t{mean_gf-cgf:+.4f}\t{s["pseudomonas_gf"]}\t{m["Genome fraction (%)"]}\t{na50:.1f}\t{na50-bna:+.1f}\t{na50-cna:+.1f}\t{dup:.4f}\t{mis}\t{mis-cmis:+d}\t{local}\t{local-clocal:+d}\t{"PASS" if strict else "FAIL"}\t{"PASS" if explore else "FAIL"}\n'
                  )
          print(out.read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nproduction_backbone\tstage8_depth3\nstage12_marker_k\t21\nstage12_linkage\tunique_unitig_family_markers_same_physical_pair\nstage12_branch_source_linkage\texcluded\nstage12_variant_rescue\trequires_stage11_local_eligibility\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage12-variant-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/bridge_repeat/pipeline_manifest.json
            benchmark/bridge_repeat/stage8_backbone_stats.json
            benchmark/bridge_repeat/stage11_aggressive/*.json
            benchmark/bridge_repeat/stage11_aggressive/*.tsv
            benchmark/bridge_repeat/stage12_variant_guard/*.json
            benchmark/bridge_repeat/stage12_variant_guard/*.tsv
            benchmark/bridge_repeat/stage12_variant_guard/candidate_*/gap_consensus.tsv
            benchmark/metaquast/combined_reference/report.tsv
            benchmark/metaquast/combined_reference/transposed_report.tsv
            benchmark/species_quast/*/report.tsv
          retention-days: 14
