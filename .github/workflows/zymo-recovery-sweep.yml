name: Zymo Log recovery sweep

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Number of ERR2935805 read pairs
        required: false
        default: "500000"
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-recovery-sweep.yml

concurrency:
  group: zymo-recovery-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAIRS: ${{ inputs.pairs || '500000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install assembler and evaluation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit curl unzip minimap2
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp
      - name: Download deterministic reads and Zymo references
        run: |
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          test -s /tmp/zymo-references.fasta
      - name: Build BridgeAsm
        run: cargo build --release
      - name: Run BridgeAsm k sweep
        run: |
          run_bridgeasm() {
            name=$1
            k=$2
            mercy=$3
            mkdir -p "benchmark/$name"
            /usr/bin/time -v -o "benchmark/$name.time.txt" \
              target/release/bridgeasm assemble \
                -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                -o "benchmark/$name" -k "$k" \
                --min-count 2 --mercy-max-kmers "$mercy" \
                --mercy-min-support 1 --mercy-min-quality 25 \
                --min-read-support 2 --min-pair-support 2 \
                --min-primary-support 5 --primary-dominance 0.75 \
                --min-contig-length 200 --threads 2
          }
          run_bridgeasm bridgeasm-k21 21 24
          run_bridgeasm bridgeasm-k31 31 16
          run_bridgeasm bridgeasm-k51 51 8
          run_bridgeasm bridgeasm-k91 91 4
          run_bridgeasm bridgeasm-k147 147 0
      - name: Prepare per-k and cross-k recovery layers
        run: |
          names="bridgeasm-k21 bridgeasm-k31 bridgeasm-k51 bridgeasm-k91 bridgeasm-k147"
          for name in $names; do
            cp "benchmark/$name/primary_contigs.fasta" \
              "benchmark/assemblies/$name-primary.fasta"
            python3 scripts/merge_fasta_unique.py \
              "benchmark/assemblies/$name-all-exact.fasta" \
              "benchmark/$name/primary_contigs.fasta" \
              "benchmark/$name/unitigs.fasta" \
              "benchmark/$name/haplotigs.fasta" \
              --min-length 200
            python3 scripts/merge_fasta_unique.py \
              "benchmark/assemblies/$name-allele-inclusive.fasta" \
              "benchmark/$name/primary_contigs.fasta" \
              "benchmark/$name/unitigs.fasta" \
              "benchmark/$name/haplotigs.fasta" \
              "benchmark/$name/variants.fasta" \
              --min-length 200
          done
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/bridgeasm-multik-primary-union.fasta \
            benchmark/assemblies/bridgeasm-k21-primary.fasta \
            benchmark/assemblies/bridgeasm-k31-primary.fasta \
            benchmark/assemblies/bridgeasm-k51-primary.fasta \
            benchmark/assemblies/bridgeasm-k91-primary.fasta \
            benchmark/assemblies/bridgeasm-k147-primary.fasta \
            --min-length 200
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/bridgeasm-multik-exact-union.fasta \
            benchmark/assemblies/bridgeasm-k21-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k31-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k51-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k91-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k147-all-exact.fasta \
            --min-length 200
          python3 scripts/merge_fasta_unique.py \
            benchmark/assemblies/bridgeasm-multik-allele-union.fasta \
            benchmark/assemblies/bridgeasm-k21-allele-inclusive.fasta \
            benchmark/assemblies/bridgeasm-k31-allele-inclusive.fasta \
            benchmark/assemblies/bridgeasm-k51-allele-inclusive.fasta \
            benchmark/assemblies/bridgeasm-k91-allele-inclusive.fasta \
            benchmark/assemblies/bridgeasm-k147-allele-inclusive.fasta \
            --min-length 200
          for fasta in benchmark/assemblies/bridgeasm-*.fasta; do
            base=$(basename "$fasta" .fasta)
            python3 scripts/fasta_stats.py "$fasta" \
              --json "benchmark/$base.stats.json" \
              > "benchmark/$base.stats.tsv"
          done
      - name: Run MEGAHIT
        run: |
          /usr/bin/time -v -o benchmark/megahit.time.txt \
            megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              -o benchmark/megahit --min-contig-len 200 -t 2
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
          python3 scripts/fasta_stats.py benchmark/megahit/final.contigs.fa \
            --json benchmark/megahit.stats.json > benchmark/megahit.stats.tsv
      - name: Run MetaQUAST recovery sweep
        run: |
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridgeasm-k21-primary.fasta \
            benchmark/assemblies/bridgeasm-k21-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k31-primary.fasta \
            benchmark/assemblies/bridgeasm-k31-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k51-primary.fasta \
            benchmark/assemblies/bridgeasm-k51-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k91-primary.fasta \
            benchmark/assemblies/bridgeasm-k91-all-exact.fasta \
            benchmark/assemblies/bridgeasm-k147-primary.fasta \
            benchmark/assemblies/bridgeasm-k147-all-exact.fasta \
            benchmark/assemblies/bridgeasm-multik-primary-union.fasta \
            benchmark/assemblies/bridgeasm-multik-exact-union.fasta \
            benchmark/assemblies/bridgeasm-multik-allele-union.fasta \
            benchmark/assemblies/megahit.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads 2 --min-contig 200 --no-plots
      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nk_values\t21,31,51,91,147\nmerge_semantics\texact_reverse_complement_deduplication\n' \
            "$GITHUB_SHA" "$PAIRS" > benchmark/benchmark_provenance.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: zymo-log-recovery-sweep-500k
          path: benchmark
          retention-days: 14
