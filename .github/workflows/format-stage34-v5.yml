name: Format Stage34 v5

on:
  push:
    branches:
      - codex/stage34-adaptive-multik
    paths:
      - .github/workflows/format-stage34-v5.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage34-adaptive-multik
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final v5 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          hybrid=Path('src/multik_hybrid.rs')
          text=hybrid.read_text().replace('value % 2 == 0', 'value.is_multiple_of(2)')
          hybrid.write_text(text)

          lib=Path('src/lib.rs')
          text=lib.read_text().replace('#[allow(clippy::manual_is_multiple_of)]\npub mod multik_hybrid;\n', 'pub mod multik_hybrid;\n')
          lib.write_text(text)
          PY
          cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multik_hybrid.rs src/main.rs src/lib.rs
          if git diff --cached --quiet; then
            echo 'no formatting changes'
            exit 0
          fi
          git commit -m 'stage34: finalize v5 formatting and lint cleanup'
          git push origin HEAD:codex/stage34-adaptive-multik
