name: BridgeBin v1 reconciliation

on:
  push:
    branches:
      - codex/bridgebin-v1-reconcile
    paths:
      - src/bridgebin.rs
      - src/bridgebin_reconcile.rs
      - src/bridgebin_quant.rs
      - src/bin/bridgebin.rs
      - src/lib.rs
      - scripts/bridgebin_benchmark.py
      - scripts/bridgebin_zymo_reference_benchmark.py
      - scripts/split_zymo_references.py
      - .github/workflows/bridgebin-v1-reconcile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate and build
        run: |
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::field-reassign-with-default -A clippy::unnecessary-sort-by
          cargo test --all-targets --all-features
          cargo build --release --bin bridgebin
          python3 -m py_compile scripts/bridgebin_benchmark.py scripts/bridgebin_zymo_reference_benchmark.py scripts/split_zymo_references.py

      - name: Prepare Zymo reference benchmark
        run: |
          set -euo pipefail
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python3 scripts/bridgebin_zymo_reference_benchmark.py \
            --reference-dir /tmp/zymo-species-refs \
            --out benchmark/bridgebin_v1 \
            --seed 43 --min-fragment 2200 --max-fragment 8500 --min-contig 1500

      - name: Run v0 and v1 sweep
        run: |
          set -euo pipefail
          base='benchmark/bridgebin_v1'
          target/release/bridgebin --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" \
            --out-dir "$base/v0" --no-reconcile >/tmp/v0.log 2>&1
          python3 scripts/bridgebin_benchmark.py evaluate \
            --truth "$base/truth.tsv" --truth-abundance "$base/truth_abundance.tsv" \
            --assignments "$base/v0/assignments.tsv" --abundance "$base/v0/abundance.tsv" \
            --output "$base/v0.metrics.json" >/dev/null

          for spec in \
            0.68:0.78 \
            0.70:0.80 \
            0.72:0.82 \
            0.74:0.84 \
            0.76:0.86; do
            thr="${spec%%:*}"
            comp="${spec##*:}"
            tag="v1_t${thr}_c${comp}"
            /usr/bin/time -v -o "$base/$tag.runtime.txt" \
              target/release/bridgebin \
                --contigs "$base/contigs.fa" --coverage "$base/coverage.tsv" \
                --out-dir "$base/$tag" \
                --reconcile-threshold "$thr" \
                --same-coverage-min-composition "$comp" \
                >"$base/$tag.log" 2>&1
            python3 scripts/bridgebin_benchmark.py evaluate \
              --truth "$base/truth.tsv" --truth-abundance "$base/truth_abundance.tsv" \
              --assignments "$base/$tag/assignments.tsv" --abundance "$base/$tag/abundance.tsv" \
              --output "$base/$tag.metrics.json" >/dev/null
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('benchmark/bridgebin_v1')
          rows=[]
          for p in root.glob('*.metrics.json'):
              m=json.loads(p.read_text())
              rows.append((m['f1'], p.stem, m))
          print('setting\tbins\tpurity\trecall\tf1\tari\thq\tmq\tdepth_mape\trel_abundance_mae')
          for _, name, m in sorted(rows, reverse=True):
              print(f"{name}\t{m['predicted_bins']}\t{m['weighted_purity']:.6f}\t{m['bp_recall']:.6f}\t{m['f1']:.6f}\t{m['ari']:.6f}\t{m['hq_like_genomes_90_95']}\t{m['mq_like_genomes_50_90']}\t{m['depth_mape']:.6f}\t{m['relative_abundance_mae']:.6f}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgebin-v1-reconcile
          path: benchmark/bridgebin_v1
          retention-days: 14
