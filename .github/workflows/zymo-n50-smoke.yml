name: Zymo Log N50 path-cover smoke

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-n50-smoke.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - scripts/stitch_exact_overlaps.py
  workflow_dispatch:
    inputs:
      pairs:
        description: Number of ERR2935805 read pairs
        required: false
        default: "50000"

concurrency:
  group: zymo-n50-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PAIRS: ${{ inputs.pairs || '50000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit curl unzip minimap2
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp
      - name: Download deterministic reads and references
        run: |
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          test -s /tmp/zymo-references.fasta
      - name: Build and test BridgeAsm
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo build --release
      - name: Run N50 path-cover configurations
        run: |
          run_bridgeasm() {
            name=$1
            k=$2
            min_read=$3
            min_primary=$4
            dominance=$5
            shift 5
            mkdir -p "benchmark/$name"
            /usr/bin/time -v -o "benchmark/$name.time.txt" \
              target/release/bridgeasm assemble \
                -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                -o "benchmark/$name" -k "$k" \
                --min-count 2 --mercy-max-kmers 24 \
                --mercy-min-support 1 --mercy-min-quality 25 \
                --min-read-support "$min_read" --min-pair-support 2 \
                --min-primary-support "$min_primary" --primary-dominance "$dominance" \
                --min-contig-length 200 --threads 2 "$@"
            cp "benchmark/$name/primary_contigs.fasta" \
              "benchmark/assemblies/$name.fasta"
            python3 scripts/fasta_stats.py "benchmark/$name/primary_contigs.fasta" \
              --json "benchmark/$name.stats.json" > "benchmark/$name.stats.tsv"
          }
          run_bridgeasm k21-threaded 21 2 5 0.75 --threaded-path-cover
          run_bridgeasm k31-baseline 31 2 5 0.75
          run_bridgeasm k31-threaded 31 2 5 0.75 --threaded-path-cover
          run_bridgeasm k31-relaxed 31 1 3 0.60
          run_bridgeasm k31-threaded-relaxed 31 1 3 0.60 --threaded-path-cover
      - name: Build exact-overlap stitched candidates
        run: |
          for overlap in 60 80 100; do
            python3 scripts/stitch_exact_overlaps.py \
              "benchmark/assemblies/k21-k31-threaded-stitch${overlap}.fasta" \
              benchmark/assemblies/k21-threaded.fasta \
              benchmark/assemblies/k31-threaded.fasta \
              --min-overlap "$overlap" --overlap-margin 20 --min-length 200 \
              | tee "benchmark/stitch${overlap}.log"
            python3 scripts/fasta_stats.py \
              "benchmark/assemblies/k21-k31-threaded-stitch${overlap}.fasta" \
              --json "benchmark/stitch${overlap}.stats.json" \
              > "benchmark/stitch${overlap}.stats.tsv"
          done
      - name: Run MEGAHIT
        run: |
          /usr/bin/time -v -o benchmark/megahit.time.txt \
            megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              -o benchmark/megahit --min-contig-len 200 -t 2
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
          python3 scripts/fasta_stats.py benchmark/megahit/final.contigs.fa \
            --json benchmark/megahit.stats.json > benchmark/megahit.stats.tsv
      - name: Run MetaQUAST
        run: |
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/k21-threaded.fasta \
            benchmark/assemblies/k31-baseline.fasta \
            benchmark/assemblies/k31-threaded.fasta \
            benchmark/assemblies/k31-relaxed.fasta \
            benchmark/assemblies/k31-threaded-relaxed.fasta \
            benchmark/assemblies/k21-k31-threaded-stitch60.fasta \
            benchmark/assemblies/k21-k31-threaded-stitch80.fasta \
            benchmark/assemblies/k21-k31-threaded-stitch100.fasta \
            benchmark/assemblies/megahit.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads 2 --min-contig 200 --no-plots
      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nfeature\tdominant_same_read_triplet_path_cover\n' \
            "$GITHUB_SHA" "$PAIRS" > benchmark/benchmark_provenance.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: zymo-log-n50-path-cover-smoke
          path: benchmark
          retention-days: 14
