name: Zymo 200k Stage16 root cause

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage16-root-cause-200k.yml
      - scripts/stage16_root_cause.py
      - scripts/test_stage16_root_cause.py
      - scripts/stage15_structural_recovery.py
      - scripts/stage14_amplified_methods.py
      - scripts/stage10_multik_rescue.py
      - scripts/stage8_backbone_optimizer.py
      - scripts/stage789_optimizer.py
      - scripts/graph_path_phaser.py
      - scripts/repeat_graph_optimizer.py
      - scripts/low_abundance_rescue.py
      - scripts/make_virtual_pairs.py
      - scripts/stitch_exact_overlaps.py
      - scripts/filter_contained_fasta.py
      - scripts/merge_fasta_unique.py
      - src/**
  workflow_dispatch:

concurrency:
  group: zymo-stage16-root-cause-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install assemblers and evaluation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit spades curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/stage14_amplified_methods.py \
            scripts/stage15_structural_recovery.py \
            scripts/stage16_root_cause.py \
            scripts/test_stage16_root_cause.py
          PYTHONPATH=scripts python3 scripts/test_stage789_optimizer.py
          PYTHONPATH=scripts python3 scripts/test_low_abundance_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage10_multik_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage14_amplified_methods.py
          PYTHONPATH=scripts python3 scripts/test_stage15_structural_recovery.py
          PYTHONPATH=scripts python3 scripts/test_stage16_root_cause.py
          cargo build --release

      - name: Build fixed Stage8 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
            --pipeline-dir benchmark/bridge_repeat \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --segment-anchor-bases 31 \
            --lookahead-depth 3 \
            --lookahead-max-branch 4
          cp benchmark/bridge_repeat/bridge_backbone.fasta benchmark/assemblies/bridge_stage8.fasta

      - name: Build Stage10 strict baseline
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage10.time.txt \
            python3 scripts/stage10_multik_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" --ks 17,21,25,31
          cp benchmark/bridge_repeat/stage10_multik_rescue/candidate_multik_strict/primary_contigs.fasta \
             benchmark/assemblies/bridge_stage10_strict.fasta

      - name: Run Stage16 root-cause experiments
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage16.time.txt \
            python3 scripts/stage16_root_cause.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS"
          root=benchmark/bridge_repeat/stage16_root_cause
          cp "$root/approx_thread/candidate_approx_thread/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage16_approx_thread.fasta
          cp "$root/local_rare/candidate_local_rare/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage16_local_rare.fasta
          cp "$root/combined/candidate_combined/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage16_combined.fasta

      - name: Summarize mechanism diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('benchmark/bridge_repeat/stage16_root_cause')
          s=json.loads((root/'stage16_stats.json').read_text())
          a=s['methods']['approx_thread']
          q=a['approx_k15_minimizer']
          r=s['methods']['local_rare']
          rows=[]
          def add(k,v): rows.append((k,v))
          add('exact_k31_threaded_reads', a['exact_k31']['threaded_reads'])
          add('approx_threaded_reads', q['threaded_reads'])
          add('approx_only_threaded_reads', q['approx_only_threaded_reads'])
          add('reads_with_ambiguous_anchors', q['reads_with_ambiguous_anchors'])
          add('threaded_with_ambiguous_anchor', q['threaded_with_ambiguous_anchor'])
          add('ambiguous_anchors_on_accepted_chains', q['ambiguous_anchors_on_accepted_chains'])
          add('graph_bridge_reads', q['graph_bridge_reads'])
          add('dropped_repetitive_k15_keys', q['dropped_repetitive_keys'])
          add('incremental_contexts', a['incremental_contexts'])
          add('incremental_context_weight', a['incremental_context_weight'])
          for key in ('input_seed_records','signature_eligible_seeds','seeds_without_enough_unique_signature',
                      'total_library_pairs','initial_pairs','second_round_pairs','total_recruited_pairs',
                      'recruited_library_fraction','seeds_with_recruited_pairs','expanded_signatures',
                      'evidence_records','selected_records','selected_seed_loci','selected_bases','selected_fresh31'):
              add('local_'+key, r.get(key, 0))
          for k in (17,21,25,31):
              gfa=root/'local_rare'/f'k{k}'/'assembly.gfa'
              nodes=edges=bases=0
              if gfa.exists():
                  with gfa.open() as h:
                      for line in h:
                          if line.startswith('S\t'):
                              f=line.rstrip().split('\t'); nodes+=1; bases+=len(f[2])
                          elif line.startswith('L\t'):
                              edges+=1
              add(f'local_k{k}_gfa_nodes', nodes)
              add(f'local_k{k}_gfa_edges', edges)
              add(f'local_k{k}_gfa_segment_bases', bases)
              prof=r.get('assembly_profiles',{}).get(f'k{k}',{})
              for pk,pv in sorted(prof.items()):
                  if isinstance(pv,(int,float,str,bool)):
                      add(f'local_k{k}_profile_{pk}', pv)
          with Path('benchmark/stage16_diagnostics.tsv').open('w') as out:
              out.write('metric\tvalue\n')
              for key,value in rows:
                  out.write(f'{key}\t{value}\n')
          print(Path('benchmark/stage16_diagnostics.tsv').read_text())
          PY

      - name: Run MEGAHIT and metaSPAdes controls
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/megahit.time.txt \
            megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                    -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                    -o benchmark/megahit --min-contig-len 200 -t "$THREADS"
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
          /usr/bin/time -v -o benchmark/metaspades.time.txt \
            metaspades.py -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                          -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                          -o benchmark/metaspades -t "$THREADS" -m 6 --only-assembler
          cp benchmark/metaspades/contigs.fasta benchmark/assemblies/metaspades.fasta

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage8.fasta \
            benchmark/assemblies/bridge_stage10_strict.fasta \
            benchmark/assemblies/bridge_stage16_approx_thread.fasta \
            benchmark/assemblies/bridge_stage16_local_rare.fasta \
            benchmark/assemblies/bridge_stage16_combined.fasta \
            benchmark/assemblies/megahit.fasta \
            benchmark/assemblies/metaspades.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage8.fasta benchmark/assemblies/bridge_stage10_strict.fasta benchmark/assemblies/bridge_stage16_approx_thread.fasta benchmark/assemblies/bridge_stage16_local_rare.fasta benchmark/assemblies/bridge_stage16_combined.fasta benchmark/assemblies/megahit.fasta benchmark/assemblies/metaspades.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Compare Stage16 without metric gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open() as h: return list(csv.DictReader(h, delimiter='\t'))
          meta={r['Assembly']:r for r in rows('benchmark/metaquast_summary.tsv')}
          species={r['assembly']:r for r in rows('benchmark/species_summary.tsv')}
          baseline='bridge_stage10_strict'
          names=['bridge_stage8','bridge_stage10_strict','bridge_stage16_approx_thread',
                 'bridge_stage16_local_rare','bridge_stage16_combined','megahit','metaspades']
          b=meta[baseline]; bs=species[baseline]
          bgf=float(bs['bacteria_mean_gf']); bps=float(bs['pseudomonas_gf']); bna=float(b['NA50'])
          with Path('benchmark/stage16_comparison.tsv').open('w') as out:
              out.write('assembly\tmean_gf\tdelta_mean_gf\tpseudomonas_gf\tdelta_pseudomonas\tcombined_gf\tna50\tdelta_na50\tdup\tmisassemblies\tlocal_misassemblies\n')
              for name in names:
                  m=meta[name]; sp=species[name]
                  gf=float(sp['bacteria_mean_gf']); ps=float(sp['pseudomonas_gf']); na=float(m['NA50'])
                  out.write(f'{name}\t{gf:.4f}\t{gf-bgf:+.4f}\t{ps:.4f}\t{ps-bps:+.4f}\t{m["Genome fraction (%)"]}\t{na:.1f}\t{na-bna:+.1f}\t{float(m["Duplication ratio"]):.4f}\t{int(float(m["# misassemblies"]))}\t{int(float(m["# local misassemblies"]))}\n')
          print(Path('benchmark/stage16_comparison.tsv').read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nbaseline\tStage10_strict\nselection_policy\troot_cause_no_metric_targets\napprox_thread\tk15_minimizer_ambiguity_aware_clean_k31_graph\nlocal_rare\tall_trusted_seed_recruitment_sparse_rescue_targeted_pool_only\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage16-root-cause-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/bridge_repeat/stage16_root_cause/stage16_stats.json
            benchmark/bridge_repeat/stage16_root_cause/approx_thread/*.tsv
            benchmark/bridge_repeat/stage16_root_cause/local_rare/*.tsv
            benchmark/bridge_repeat/stage16_root_cause/local_rare/k*/run_profile.json
            benchmark/bridge_repeat/stage16_root_cause/local_rare/k*/primary_contigs.fasta
          if-no-files-found: warn
