name: BridgeBin one-off exact cut patch

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - .github/workflows/bridgebin-oneoff-exact-cut.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bridgebin-v2-signed-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add exact signed cut for small conflicted bins
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('src/bridgebin_v21.rs')
          s=p.read_text()
          needle='    let mut best: Option<CutCandidate> = None;\n    for seed in diff_edges.iter().take(8) {\n'
          replacement='    if members.len() <= 18 {\n        return exact_binary_cut(\n            members,\n            model_hard,\n            marker_hard,\n            &diff_edges,\n            &same_edges,\n            contigs,\n        );\n    }\n\n    let mut best: Option<CutCandidate> = None;\n    for seed in diff_edges.iter().take(8) {\n'
          if needle not in s:
              raise SystemExit('best_binary_cut insertion point not found')
          s=s.replace(needle,replacement,1)
          marker='fn greedy_signed_cut(\n'
          exact=base64.b64decode('').decode()
          if marker not in s:
              raise SystemExit('greedy_signed_cut marker not found')
          s=s.replace(marker, exact+marker,1)
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridgebin_v21.rs
          git commit -m 'fix(bridgebin): exactly solve small signed conflict cuts'
          git push origin HEAD:codex/bridgebin-v2-signed-evidence
