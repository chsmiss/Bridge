name: Biological Brain matched Zymo pilot

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/biological-brain-zymo-pilot.yml
  workflow_dispatch:
    inputs:
      read_pairs:
        description: Number of paired reads streamed for the Plass pilot
        required: false
        default: "25000"

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PILOT_READ_PAIRS: ${{ inputs.read_pairs || '25000' }}

jobs:
  matched-protein-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bridge-plass
          create-args: >-
            -c conda-forge
            -c bioconda
            python=3.11
            plass
            prodigal
            mmseqs2
            quast
          cache-environment: true
          init-shell: bash

      - name: Find a successful graph artifact from the same branch
        run: |
          set -euo pipefail
          mkdir -p source_artifacts
          selected=""
          for workflow in \
            zymo-cleanpath-500k.yml \
            zymo-flowpath-500k.yml \
            zymo-midk-500k-sweep.yml \
            zymo-reference-smoke.yml
          do
            test -f ".github/workflows/${workflow}" || continue
            mapfile -t runs < <(
              gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                -f branch="${GITHUB_REF_NAME}" \
                -f status=success \
                -f per_page=20 \
                --jq '.workflow_runs[].id' 2>/dev/null || true
            )
            for run_id in "${runs[@]}"; do
              artifact_count=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                --jq '.total_count' 2>/dev/null || echo 0)
              if [[ "${artifact_count}" == "0" ]]; then
                continue
              fi
              rm -rf source_artifacts/*
              if ! gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --dir source_artifacts; then
                continue
              fi
              candidate=$(find source_artifacts -type f -name '*.gfa' -printf '%s\t%p\n' \
                | sort -nr | head -n 1 | cut -f2- || true)
              if [[ -z "${candidate}" ]]; then
                compressed=$(find source_artifacts -type f -name '*.gfa.gz' -printf '%s\t%p\n' \
                  | sort -nr | head -n 1 | cut -f2- || true)
                if [[ -n "${compressed}" ]]; then
                  gzip -dc "${compressed}" > source_artifacts/matched_graph.gfa
                  candidate=source_artifacts/matched_graph.gfa
                fi
              fi
              if [[ -n "${candidate}" && -s "${candidate}" ]]; then
                selected="${candidate}"
                echo "SOURCE_WORKFLOW=${workflow}" >> "${GITHUB_ENV}"
                echo "SOURCE_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
                echo "MATCHED_GFA=${candidate}" >> "${GITHUB_ENV}"
                break 2
              fi
            done
          done
          if [[ -z "${selected}" ]]; then
            echo "No successful artifact containing a GFA was found" >&2
            exit 2
          fi
          echo "Using ${selected} from ${SOURCE_WORKFLOW:-selected workflow}"

      - name: Resolve the exact FASTQ pair used by the source workflow
        run: |
          python biological_brain/extract_fastq_urls.py \
            --workflow ".github/workflows/${SOURCE_WORKFLOW}" \
            --github-env "${GITHUB_ENV}"

      - name: Stream a bounded paired-read subset
        run: |
          mkdir -p pilot
          python - <<'PY'
          import gzip
          import os
          import urllib.request

          pairs = int(os.environ['PILOT_READ_PAIRS'])
          for url_key, output in [('READ1_URL', 'pilot/r1.fastq'), ('READ2_URL', 'pilot/r2.fastq')]:
              url = os.environ[url_key]
              request = urllib.request.Request(url, headers={'User-Agent': 'BridgeAsm-protein-pilot'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  with gzip.GzipFile(fileobj=response) as compressed:
                      with open(output, 'wb') as handle:
                          for _ in range(pairs * 4):
                              line = compressed.readline()
                              if not line:
                                  break
                              handle.write(line)
              lines = sum(1 for _ in open(output, 'rb'))
              if lines < 4 or lines % 4:
                  raise SystemExit(f'invalid FASTQ subset in {output}: {lines} lines')
              print(output, 'records=', lines // 4, 'url=', url)
          PY
          cat pilot/r1.fastq pilot/r2.fastq > pilot/reads.fastq

      - name: Run Plass protein preassembly and exact deduplication
        run: |
          mkdir -p pilot/plass_tmp
          plass assemble \
            pilot/reads.fastq \
            pilot/plass_proteins.raw.faa \
            pilot/plass_tmp \
            --threads 2
          test -s pilot/plass_proteins.raw.faa
          python biological_brain/dedup_proteins.py \
            pilot/plass_proteins.raw.faa \
            pilot/plass_proteins.faa \
            --mapping pilot/plass_proteins.dedup.tsv \
            --json pilot/plass_proteins.dedup.json

      - name: Back-project protein paths to existing graph links
        run: |
          python biological_brain/protein_bridge_evidence.py \
            --gfa "${MATCHED_GFA}" \
            --proteins pilot/plass_proteins.faa \
            --output pilot/protein_evidence.tsv \
            --junction-nt 300 \
            --max-kmer-occurrences 24
          python biological_brain/kmer_junction_lm.py \
            --gfa "${MATCHED_GFA}" \
            --output pilot/dna_lm.tsv

      - name: Build conservative physical-only and protein-ranked paths
        run: |
          cargo build --release --bin bridgeasm-evidence-path
          common=(
            --gfa "${MATCHED_GFA}"
            --edge-evidence pilot/protein_evidence.tsv
            --mode conservative
            --min-length 200
          )
          target/release/bridgeasm-evidence-path \
            "${common[@]}" \
            --protein-weight 0 --esm-weight 0 --dna-lm-weight 0 \
            --output pilot/physical_only.fasta \
            --report pilot/physical_only.tsv
          target/release/bridgeasm-evidence-path \
            "${common[@]}" \
            --protein-weight 2400 --esm-weight 0 --dna-lm-weight 0 \
            --output pilot/physical_plus_plass.fasta \
            --report pilot/physical_plus_plass.tsv
          target/release/bridgeasm-evidence-path \
            "${common[@]}" \
            --dna-lm-scores pilot/dna_lm.tsv \
            --protein-weight 2400 --esm-weight 0 --dna-lm-weight 180 \
            --output pilot/physical_plus_plass_dna.fasta \
            --report pilot/physical_plus_plass_dna.tsv

      - name: Download Zymo reference genomes
        run: |
          curl -L --retry 3 -o pilot/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p pilot/refs
          unzip -q pilot/zymo-refs.zip -d pilot/refs
          find pilot/refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > pilot/reference.fasta
          test -s pilot/reference.fasta

      - name: Reference-level nucleotide evaluation
        run: |
          metaquast.py \
            pilot/physical_only.fasta \
            pilot/physical_plus_plass.fasta \
            pilot/physical_plus_plass_dna.fasta \
            -r pilot/reference.fasta \
            -o pilot/metaquast \
            --threads 2 --min-contig 200 --no-plots
          cp pilot/metaquast/combined_reference/report.tsv pilot/nucleotide_report.tsv
          cp pilot/metaquast/combined_reference/transposed_report.tsv pilot/nucleotide_transposed.tsv
          cat pilot/nucleotide_report.tsv

      - name: Protein recall evaluation
        run: |
          mkdir -p pilot/protein
          prodigal -q -p meta -i pilot/reference.fasta -a pilot/protein/reference.faa
          for label in physical_only physical_plus_plass physical_plus_plass_dna; do
            prodigal -q -p meta -i "pilot/${label}.fasta" -a "pilot/protein/${label}.faa"
            rm -rf "/tmp/mmseqs-${label}"
            mmseqs easy-search \
              pilot/protein/reference.faa \
              "pilot/protein/${label}.faa" \
              "pilot/protein/${label}.m8" \
              "/tmp/mmseqs-${label}" \
              --threads 2 -s 7.5 -e 1e-3 --max-seqs 50 \
              --format-output 'query,target,fident,alnlen,qstart,qend,qlen,tstart,tend,tlen,evalue,bits'
          done
          python scripts/protein_recall.py \
            --reference pilot/protein/reference.faa \
            --sample physical_only pilot/protein/physical_only.faa pilot/protein/physical_only.m8 \
            --sample physical_plus_plass pilot/protein/physical_plus_plass.faa pilot/protein/physical_plus_plass.m8 \
            --sample physical_plus_plass_dna pilot/protein/physical_plus_plass_dna.faa pilot/protein/physical_plus_plass_dna.m8 \
            --min-identity 0.80 --min-query-coverage 0.80 --min-target-coverage 0.80 \
            --json pilot/protein_recall.json \
            | tee pilot/protein_recall.tsv

      - name: Summarize edge changes and safety deltas
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from collections import Counter

          def selected(path):
              out = set()
              with open(path, newline='') as handle:
                  for row in csv.DictReader(handle, delimiter='\t'):
                      if row['selected'] == 'true':
                          out.add((row['source'], row['target']))
              return out

          classes = Counter()
          supported = 0
          with open('pilot/protein_evidence.tsv', newline='') as handle:
              for row in csv.DictReader(handle, delimiter='\t'):
                  classes[row['breakpoint_class']] += 1
                  supported += row['breakpoint_class'] == 'same_orf_supported'

          control = selected('pilot/physical_only.tsv')
          plass = selected('pilot/physical_plus_plass.tsv')
          fused = selected('pilot/physical_plus_plass_dna.tsv')
          summary = {
              'source_workflow': os.environ['SOURCE_WORKFLOW'],
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'read_pairs_for_plass': int(os.environ['PILOT_READ_PAIRS']),
              'protein_evidence_classes': dict(classes),
              'supported_existing_edges': supported,
              'physical_only_edges': len(control),
              'plass_edges': len(plass),
              'plass_edges_changed_vs_control': len(control ^ plass),
              'fused_edges': len(fused),
              'fused_edges_changed_vs_plass': len(plass ^ fused),
              'safety_rule': 'All three path runs use conservative mode; only physical GFA links are eligible.',
          }
          with open('pilot/pilot_summary.json', 'w') as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biological-brain-zymo-pilot
          path: |
            pilot/plass_proteins.raw.faa
            pilot/plass_proteins.faa
            pilot/plass_proteins.dedup.tsv
            pilot/plass_proteins.dedup.json
            pilot/protein_evidence.tsv
            pilot/dna_lm.tsv
            pilot/physical_only.fasta
            pilot/physical_plus_plass.fasta
            pilot/physical_plus_plass_dna.fasta
            pilot/physical_only.tsv
            pilot/physical_plus_plass.tsv
            pilot/physical_plus_plass_dna.tsv
            pilot/nucleotide_report.tsv
            pilot/nucleotide_transposed.tsv
            pilot/protein_recall.tsv
            pilot/protein_recall.json
            pilot/pilot_summary.json
          if-no-files-found: warn
