name: Zymo Log 500k coverage-flow challenge

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - src/bin/bridgeasm-flowpath.rs
      - .github/workflows/zymo-flowpath-500k.yml
      - src/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PAIRS: 500000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit curl unzip minimap2
          curl -L --retry 3 -o /tmp/quast.tar.gz https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp
      - name: Download deterministic Zymo subset and references
        run: |
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip 'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
      - name: Build and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          cargo build --release
      - name: Build k29 and k31 relaxed graphs
        run: |
          run_base() {
            name=$1
            k=$2
            mkdir -p "benchmark/$name"
            target/release/bridgeasm assemble \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              -o "benchmark/$name" -k "$k" \
              --min-count 2 --mercy-max-kmers 48 \
              --mercy-min-support 1 --mercy-min-quality 25 \
              --min-read-support 1 --min-pair-support 2 \
              --min-primary-support 3 --primary-dominance 0.60 \
              --min-contig-length 200 --threads 2
            cp "benchmark/$name/primary_contigs.fasta" "benchmark/assemblies/$name-primary.fasta"
          }
          run_base k29-relaxed 29
          run_base k31-relaxed 31
      - name: Run coverage-flow modes
        run: |
          run_flow() {
            base=$1
            mode=$2
            extra=$3
            name="${base}-flow-${mode}${extra:+-$extra}"
            args=""
            case "$extra" in
              loose) args="--disconnect-ratio 0.05 --low-local-ratio 0.10 --sibling-ratio 0.05" ;;
              strict) args="--disconnect-ratio 0.15 --low-local-ratio 0.30 --sibling-ratio 0.15" ;;
              *) args="" ;;
            esac
            target/release/bridgeasm-flowpath \
              --gfa "benchmark/$base/assembly.gfa" \
              --output "benchmark/assemblies/$name.fasta" \
              --report "benchmark/$name.tsv" \
              --mode "$mode" --min-direct 2 --min-pair 2 \
              --min-length 200 $args
            python3 scripts/fasta_stats.py "benchmark/assemblies/$name.fasta" \
              --json "benchmark/$name.stats.json" > "benchmark/$name.stats.tsv"
          }
          for base in k29-relaxed k31-relaxed; do
            run_flow "$base" conservative ""
            run_flow "$base" megahit ""
            run_flow "$base" megahit loose
            run_flow "$base" aggressive ""
            run_flow "$base" aggressive loose
            run_flow "$base" coverage ""
          done
      - name: Run MEGAHIT
        run: |
          megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            -o benchmark/megahit --min-contig-len 200 -t 2
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
      - name: Run MetaQUAST
        run: |
          python3 /tmp/quast-5.3.0/metaquast.py benchmark/assemblies/*.fasta \
            -r /tmp/zymo-references.fasta -o benchmark/metaquast \
            --threads 2 --min-contig 200 --no-plots
      - name: Print compact report
        run: |
          echo '=== FASTA stats ==='
          for f in benchmark/*.stats.tsv; do echo "--- $f"; cat "$f"; done
          echo '=== MetaQUAST report ==='
          cat benchmark/metaquast/combined_reference/report.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: zymo-flowpath-500k
          path: |
            benchmark/*.stats.tsv
            benchmark/*.stats.json
            benchmark/*flow*.tsv
            benchmark/metaquast/combined_reference/report.tsv
            benchmark/metaquast/combined_reference/transposed_report.tsv
            benchmark/metaquast/summary
          retention-days: 14
