name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/bridgeasm-rust-v0'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply rustfmt"
            git push
          fi
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --all-targets --all-features
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py
      - name: End-to-end smoke
        run: |
          python3 scripts/simulate_metagenome.py \
            --output /tmp/bridgeasm-smoke \
            --genome-length 6000 \
            --major-depth 15 \
            --minor-depth 3 \
            --seed 43
          cargo run --release -- assemble \
            -1 /tmp/bridgeasm-smoke/reads_R1.fastq.gz \
            -2 /tmp/bridgeasm-smoke/reads_R2.fastq.gz \
            -o /tmp/bridgeasm-out \
            -k 31 --min-count 2 --mercy-max-kmers 16 \
            --min-read-support 2 --min-contig-length 100
          test -s /tmp/bridgeasm-out/primary_contigs.fasta
          python3 scripts/evaluate_synthetic.py \
            --major /tmp/bridgeasm-smoke/major.fasta \
            --minor /tmp/bridgeasm-smoke/minor.fasta \
            --variants /tmp/bridgeasm-smoke/minor_variants.tsv \
            --contigs /tmp/bridgeasm-out/primary_contigs.fasta
