name: Zymo 200k Stage15 structural recovery

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage15-structural-200k.yml
      - scripts/stage15_structural_recovery.py
      - scripts/test_stage15_structural_recovery.py
      - scripts/stage14_amplified_methods.py
      - scripts/stage13_three_methods.py
      - scripts/stage10_multik_rescue.py
      - scripts/stage8_backbone_optimizer.py
      - scripts/stage789_optimizer.py
      - scripts/graph_path_phaser.py
      - scripts/repeat_graph_optimizer.py
      - scripts/low_abundance_rescue.py
      - scripts/make_virtual_pairs.py
      - scripts/stitch_exact_overlaps.py
      - scripts/filter_contained_fasta.py
      - scripts/merge_fasta_unique.py
      - src/**
  workflow_dispatch:

concurrency:
  group: zymo-stage15-structural-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install assemblers and evaluation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y megahit spades curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/stage13_three_methods.py \
            scripts/stage14_amplified_methods.py \
            scripts/stage15_structural_recovery.py \
            scripts/test_stage15_structural_recovery.py
          PYTHONPATH=scripts python3 scripts/test_stage789_optimizer.py
          PYTHONPATH=scripts python3 scripts/test_low_abundance_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage10_multik_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage13_three_methods.py
          PYTHONPATH=scripts python3 scripts/test_stage14_amplified_methods.py
          PYTHONPATH=scripts python3 scripts/test_stage15_structural_recovery.py
          cargo build --release

      - name: Build fixed Stage8 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
            --pipeline-dir benchmark/bridge_repeat \
            --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
            --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
            --segment-anchor-bases 31 \
            --lookahead-depth 3 \
            --lookahead-max-branch 4
          cp benchmark/bridge_repeat/bridge_backbone.fasta benchmark/assemblies/bridge_stage8.fasta

      - name: Build Stage10 strict baseline
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage10.time.txt \
            python3 scripts/stage10_multik_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" --ks 17,21,25,31
          cp benchmark/bridge_repeat/stage10_multik_rescue/candidate_multik_strict/primary_contigs.fasta \
             benchmark/assemblies/bridge_stage10_strict.fasta

      - name: Run Stage15 structural recovery
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage15.time.txt \
            python3 scripts/stage15_structural_recovery.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" --ks 17,21,25,31
          root=benchmark/bridge_repeat/stage15_structural_recovery
          cp "$root/soft_thread/candidate_soft_thread/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage15_soft_thread.fasta
          cp "$root/rare_reintegration/candidate_reintegrated/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage15_reintegrated.fasta
          cp "$root/reintegrated_flow/candidate_long_flow/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage15_flow_reintegrated.fasta
          cp "$root/reintegrated_plus_flow/candidate_reintegrated_plus_flow/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage15_reintegrated_plus_flow.fasta
          cp "$root/combined/candidate_combined/primary_contigs.fasta" \
             benchmark/assemblies/bridge_stage15_combined.fasta
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark/bridge_repeat/stage15_structural_recovery/stage15_stats.json')
          s=json.loads(p.read_text())
          soft=s['methods']['soft_thread']; re=s['methods']['rare_reintegration']; flow=s['methods']['reintegrated_flow']
          with Path('benchmark/stage15_diagnostics.tsv').open('w') as out:
              out.write('metric\tvalue\n')
              for k in (31,21,17):
                  st=soft[f'k{k}_threading']
                  out.write(f'k{k}_threaded_reads\t{st["threaded_reads"]}\n')
                  out.write(f'k{k}_segments\t{st["segments"]}\n')
                  out.write(f'k{k}_contexts\t{st["contexts"]}\n')
              out.write(f'incremental_contexts\t{soft["incremental_contexts"]}\n')
              out.write(f'threaded_read_gain_vs_k31\t{soft["threaded_read_gain_vs_k31"]}\n')
              for k in (31,41,55):
                  prof=re[f'k{k}']
                  out.write(f'reintegrated_k{k}_primary_bases\t{prof.get("primary_bases",0)}\n')
                  out.write(f'reintegrated_k{k}_primary_n50\t{prof.get("primary_n50",0)}\n')
                  out.write(f'reintegrated_k{k}_primary_contigs\t{prof.get("primary_contigs",0)}\n')
              out.write(f'flow_tangles\t{flow.get("tangles",0)}\n')
              out.write(f'flow_selected_records\t{flow.get("selected_records",0)}\n')
              out.write(f'flow_selected_bases\t{flow.get("selected_bases",0)}\n')
          print(Path('benchmark/stage15_diagnostics.tsv').read_text())
          PY

      - name: Run MEGAHIT and metaSPAdes controls
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/megahit.time.txt \
            megahit -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                    -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                    -o benchmark/megahit --min-contig-len 200 -t "$THREADS"
          cp benchmark/megahit/final.contigs.fa benchmark/assemblies/megahit.fasta
          /usr/bin/time -v -o benchmark/metaspades.time.txt \
            metaspades.py -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                          -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                          -o benchmark/metaspades -t "$THREADS" -m 6 --only-assembler
          cp benchmark/metaspades/contigs.fasta benchmark/assemblies/metaspades.fasta

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage8.fasta \
            benchmark/assemblies/bridge_stage10_strict.fasta \
            benchmark/assemblies/bridge_stage15_soft_thread.fasta \
            benchmark/assemblies/bridge_stage15_reintegrated.fasta \
            benchmark/assemblies/bridge_stage15_flow_reintegrated.fasta \
            benchmark/assemblies/bridge_stage15_reintegrated_plus_flow.fasta \
            benchmark/assemblies/bridge_stage15_combined.fasta \
            benchmark/assemblies/megahit.fasta \
            benchmark/assemblies/metaspades.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage8.fasta benchmark/assemblies/bridge_stage10_strict.fasta benchmark/assemblies/bridge_stage15_soft_thread.fasta benchmark/assemblies/bridge_stage15_reintegrated.fasta benchmark/assemblies/bridge_stage15_flow_reintegrated.fasta benchmark/assemblies/bridge_stage15_reintegrated_plus_flow.fasta benchmark/assemblies/bridge_stage15_combined.fasta benchmark/assemblies/megahit.fasta benchmark/assemblies/metaspades.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Score Stage15 gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open() as h: return list(csv.DictReader(h, delimiter='\t'))
          meta={r['Assembly']:r for r in rows('benchmark/metaquast_summary.tsv')}
          species={r['assembly']:r for r in rows('benchmark/species_summary.tsv')}
          baseline='bridge_stage10_strict'
          candidates=['bridge_stage15_soft_thread','bridge_stage15_reintegrated','bridge_stage15_flow_reintegrated','bridge_stage15_reintegrated_plus_flow','bridge_stage15_combined']
          b=meta[baseline]; bs=species[baseline]
          bgf=float(bs['bacteria_mean_gf']); bps=float(bs['pseudomonas_gf']); bna=float(b['NA50'])
          with Path('benchmark/stage15_gate.tsv').open('w') as out:
              out.write('assembly\tmean_gf\tdelta_gf\tpseudomonas_gf\tdelta_pseudomonas\tcombined_gf\tna50\tdelta_na50\tdup\tmisassemblies\tlocal_misassemblies\tstrict_gate\tbreakthrough_gate\tpareto_gain\n')
              for name in candidates:
                  m=meta[name]; s=species[name]
                  gf=float(s['bacteria_mean_gf']); ps=float(s['pseudomonas_gf']); na=float(m['NA50'])
                  dup=float(m['Duplication ratio']); mis=int(float(m['# misassemblies'])); local=int(float(m['# local misassemblies']))
                  strict=dup<=1.010 and mis<=13 and local<=6 and gf>=bgf-0.01 and na>=0.95*bna
                  breakthrough=dup<=1.012 and mis<=15 and local<=8 and ((na>=1.25*bna and gf>=bgf-0.02) or (gf>=bgf+0.05 and ps>=bps+0.25 and na>=0.95*bna))
                  pareto=dup<=1.010 and mis<=13 and gf>bgf and na>bna
                  out.write(f'{name}\t{gf:.4f}\t{gf-bgf:+.4f}\t{ps:.4f}\t{ps-bps:+.4f}\t{m["Genome fraction (%)"]}\t{na:.1f}\t{na-bna:+.1f}\t{dup:.4f}\t{mis}\t{local}\t{"PASS" if strict else "FAIL"}\t{"PASS" if breakthrough else "FAIL"}\t{"PASS" if pareto else "FAIL"}\n')
          print(Path('benchmark/stage15_gate.tsv').read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nbaseline\tStage10_strict\nsoft_threading\tunique_k17_k21_unitig_anchors_incremental_context\nrare_reintegration\tStage10_strict_short_contigs_virtualized_before_k31\npersistent_multik\tk31_k41_k55\njoin_policy\texact_overlap_81bp\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage15-structural-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/bridge_repeat/pipeline_manifest.json
            benchmark/bridge_repeat/stage8_backbone_stats.json
            benchmark/bridge_repeat/stage10_multik_rescue/stage10_stats.json
            benchmark/bridge_repeat/stage10_multik_rescue/*.tsv
            benchmark/bridge_repeat/stage15_structural_recovery/**/*.json
            benchmark/bridge_repeat/stage15_structural_recovery/**/*.tsv
            benchmark/bridge_repeat/stage15_structural_recovery/**/run_profile.json
            benchmark/metaquast/combined_reference/report.tsv
            benchmark/metaquast/combined_reference/transposed_report.tsv
            benchmark/species_quast/*/report.tsv
          retention-days: 14
