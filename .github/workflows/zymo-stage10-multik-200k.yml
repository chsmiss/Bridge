name: Zymo 200k Stage10 multi-k GF and NA50

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage10-multik-200k.yml
      - scripts/stage10_multik_rescue.py
      - scripts/test_stage10_multik_rescue.py
      - scripts/stage8_backbone_optimizer.py
      - scripts/low_abundance_rescue.py
      - scripts/pair_gap_refine.py
      - scripts/stage789_optimizer.py
      - scripts/na50_repeat_pipeline.py
      - scripts/repeat_graph_optimizer.py
      - scripts/repeat_graph_optimizer_v2.py
      - scripts/graph_path_phaser.py
      - scripts/merge_backbone_replacement.py
      - scripts/postprocess_segment_grafts.py
      - scripts/filter_contained_fasta.py
      - scripts/stitch_exact_overlaps.py
      - scripts/merge_fasta_unique.py
      - src/**
  workflow_dispatch:

concurrency:
  group: zymo-stage10-multik-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spades curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/repeat_graph_optimizer_v2.py \
            scripts/na50_repeat_pipeline.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/test_stage10_multik_rescue.py \
            scripts/pair_gap_refine.py \
            scripts/merge_backbone_replacement.py \
            scripts/postprocess_segment_grafts.py \
            scripts/filter_contained_fasta.py \
            scripts/stitch_exact_overlaps.py \
            scripts/merge_fasta_unique.py
          PYTHONPATH=scripts python3 scripts/test_stage789_optimizer.py
          PYTHONPATH=scripts python3 scripts/test_low_abundance_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage10_multik_rescue.py
          cargo build --release

      - name: Build fixed Stage8 depth3 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/bridge_stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --segment-anchor-bases 31 \
              --lookahead-depth 3 \
              --lookahead-max-branch 4
          cp benchmark/bridge_repeat/bridge_backbone.fasta \
             benchmark/assemblies/bridge_stage8_backbone.fasta

      - name: Run Stage10 residual multi-k assembly
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage10_multik.time.txt \
            python3 scripts/stage10_multik_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" \
              --ks 17,21,25,31
          cp benchmark/bridge_repeat/stage10_multik_rescue/stage8_pair_exact.fasta \
             benchmark/assemblies/bridge_stage8_pair_exact.fasta
          cp benchmark/bridge_repeat/stage10_multik_rescue/candidate_multik_strict/primary_contigs.fasta \
             benchmark/assemblies/bridge_multik_strict.fasta
          cp benchmark/bridge_repeat/stage10_multik_rescue/multik_strict_pair_exact.fasta \
             benchmark/assemblies/bridge_multik_strict_pair_exact.fasta
          cp benchmark/bridge_repeat/stage10_multik_rescue/candidate_multik_balanced/primary_contigs.fasta \
             benchmark/assemblies/bridge_multik_balanced.fasta
          cp benchmark/bridge_repeat/stage10_multik_rescue/multik_balanced_pair_exact.fasta \
             benchmark/assemblies/bridge_multik_balanced_pair_exact.fasta

      - name: Probe deeper Stage8 lookahead for NA50
        run: |
          set -euo pipefail
          python3 scripts/stage8_backbone_optimizer.py \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --segment-anchor-bases 31 \
              --lookahead-depth 4 \
              --lookahead-max-branch 4
          cp benchmark/bridge_repeat/bridge_backbone.fasta \
             benchmark/assemblies/bridge_stage8_depth4.fasta
          python3 scripts/pair_gap_refine.py \
              benchmark/assemblies/bridge_stage8_depth4.fasta \
              -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              -o benchmark/assemblies/bridge_stage8_depth4_pair_exact.fasta \
              --links benchmark/stage8_depth4_pair_exact.links.tsv \
              --threads "$THREADS" --min-mapq 25 --min-support 3 \
              --dominance 0.90 --end-window 650 --min-overlap 31 --max-gap 0

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/bridge_*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run metaSPAdes control
        run: |
          /usr/bin/time -v -o benchmark/metaspades.time.txt \
            metaspades.py -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                          -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                          -o benchmark/metaspades -t "$THREADS" -m 6 --only-assembler
          cp benchmark/metaspades/contigs.fasta benchmark/assemblies/metaspades.fasta

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage8_backbone.fasta \
            benchmark/assemblies/bridge_stage8_pair_exact.fasta \
            benchmark/assemblies/bridge_stage8_depth4.fasta \
            benchmark/assemblies/bridge_stage8_depth4_pair_exact.fasta \
            benchmark/assemblies/bridge_multik_strict.fasta \
            benchmark/assemblies/bridge_multik_strict_pair_exact.fasta \
            benchmark/assemblies/bridge_multik_balanced.fasta \
            benchmark/assemblies/bridge_multik_balanced_pair_exact.fasta \
            benchmark/assemblies/metaspades.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json \
            | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage8_backbone.fasta benchmark/assemblies/bridge_stage8_pair_exact.fasta benchmark/assemblies/bridge_stage8_depth4.fasta benchmark/assemblies/bridge_stage8_depth4_pair_exact.fasta benchmark/assemblies/bridge_multik_strict.fasta benchmark/assemblies/bridge_multik_strict_pair_exact.fasta benchmark/assemblies/bridge_multik_balanced.fasta benchmark/assemblies/bridge_multik_balanced_pair_exact.fasta benchmark/assemblies/metaspades.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Score GF and NA50 promotion gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open() as handle:
                  return list(csv.DictReader(handle, delimiter='\t'))

          meta = {r['Assembly']: r for r in rows('benchmark/metaquast_summary.tsv')}
          species = {r['assembly']: r for r in rows('benchmark/species_summary.tsv')}
          baseline = 'bridge_stage8_backbone'
          candidates = [
              'bridge_stage8_pair_exact',
              'bridge_stage8_depth4',
              'bridge_stage8_depth4_pair_exact',
              'bridge_multik_strict',
              'bridge_multik_strict_pair_exact',
              'bridge_multik_balanced',
              'bridge_multik_balanced_pair_exact',
          ]
          b = meta[baseline]
          bgf = float(species[baseline]['bacteria_mean_gf'])
          bps = float(species[baseline]['pseudomonas_gf'])
          bna50 = float(b['NA50'])
          with Path('benchmark/promotion_gate.tsv').open('w') as out:
              out.write(
                  'assembly\tmean_gf\tmean_gf_delta\tpseudomonas_gf\tpseudomonas_delta'
                  '\tcombined_gf\tdup\tmisassemblies\tlocal_misassemblies\tna50\tna50_delta'
                  '\tsafety_gate\tproduction_gate\tna50_win\tgf_win\n'
              )
              for name in candidates:
                  m = meta[name]
                  s = species[name]
                  mean_gf = float(s['bacteria_mean_gf'])
                  ps = float(s['pseudomonas_gf'])
                  dup = float(m['Duplication ratio'])
                  mis = int(float(m['# misassemblies']))
                  local = int(float(m['# local misassemblies']))
                  na50 = float(m['NA50'])
                  safety = dup <= 1.010 and mis <= 13 and local <= 6 and na50 >= 0.90 * bna50
                  production = (
                      dup <= 1.008 and mis <= 12 and local <= 6
                      and na50 >= 0.95 * bna50 and mean_gf >= bgf
                  )
                  na50_win = production and na50 > bna50 and mean_gf >= bgf - 0.02
                  gf_win = production and mean_gf > bgf and ps > bps
                  out.write(
                      f"{name}\t{mean_gf:.4f}\t{mean_gf-bgf:+.4f}"
                      f"\t{ps:.4f}\t{ps-bps:+.4f}\t{m['Genome fraction (%)']}"
                      f"\t{dup:.4f}\t{mis}\t{local}\t{na50:.1f}\t{na50-bna50:+.1f}"
                      f"\t{'PASS' if safety else 'FAIL'}\t{'PASS' if production else 'FAIL'}"
                      f"\t{'YES' if na50_win else 'NO'}\t{'YES' if gf_win else 'NO'}\n"
                  )
          print(Path('benchmark/promotion_gate.tsv').read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nproduction_backbone\tstage8_depth3\nna50_probe\tstage8_depth4_plus_pair_exact\nlow_abundance_reads\tstage8_novel31mer_pairs\nlow_abundance_assembly\tindependent_k17_k21_k25_k31_cross_k_consensus\npair_join\treciprocal_dominant_exact_overlap_max_gap0\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage10-multik-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/bridge_repeat/pipeline_manifest.json
            benchmark/bridge_repeat/stage8_backbone_stats.json
            benchmark/bridge_repeat/stage10_multik_rescue/stage10_stats.json
            benchmark/bridge_repeat/stage10_multik_rescue/*.tsv
            benchmark/bridge_repeat/stage10_multik_rescue/candidate_*/containment_stats.json
            benchmark/metaquast/combined_reference/report.tsv
            benchmark/metaquast/combined_reference/transposed_report.tsv
            benchmark/species_quast/*/report.tsv
          retention-days: 14
