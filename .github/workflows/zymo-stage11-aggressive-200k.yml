name: Zymo 200k Stage11 aggressive GF and NA50

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/zymo-stage11-aggressive-200k.yml
      - scripts/stage11_aggressive_rescue.py
      - scripts/fill_scaffold_gaps_multik.py
      - scripts/test_stage11_aggressive.py
      - scripts/stage10_multik_rescue.py
      - scripts/stage8_backbone_optimizer.py
      - scripts/low_abundance_rescue.py
      - scripts/pair_gap_refine.py
      - scripts/fill_scaffold_gaps.py
      - scripts/stage789_optimizer.py
      - scripts/na50_repeat_pipeline.py
      - scripts/repeat_graph_optimizer.py
      - scripts/repeat_graph_optimizer_v2.py
      - scripts/graph_path_phaser.py
      - scripts/merge_backbone_replacement.py
      - scripts/postprocess_segment_grafts.py
      - scripts/filter_contained_fasta.py
      - scripts/stitch_exact_overlaps.py
      - scripts/merge_fasta_unique.py
  workflow_dispatch:

concurrency:
  group: zymo-stage11-aggressive-200k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PAIRS: "200000"
      THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spades curl unzip minimap2 time
          curl -L --retry 3 -o /tmp/quast.tar.gz \
            https://github.com/ablab/quast/releases/download/quast_5.3.0/quast-5.3.0.tar.gz
          tar -xzf /tmp/quast.tar.gz -C /tmp

      - name: Download deterministic 200k reads and Zymo references
        run: |
          set -euo pipefail
          mkdir -p benchmark/assemblies
          python3 scripts/download_ena_subset.py ERR2935805 /tmp/zymo-log --pairs "$PAIRS"
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          find /tmp/zymo-refs -type f \( -iname '*.fasta' -o -iname '*.fa' -o -iname '*.fna' \) -print0 \
            | sort -z | xargs -0 cat > /tmp/zymo-references.fasta
          python3 scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs \
            | tee benchmark/reference_split.tsv

      - name: Validate and build BridgeAsm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 -m py_compile \
            scripts/graph_path_phaser.py \
            scripts/repeat_graph_optimizer.py \
            scripts/repeat_graph_optimizer_v2.py \
            scripts/na50_repeat_pipeline.py \
            scripts/stage789_optimizer.py \
            scripts/stage8_backbone_optimizer.py \
            scripts/low_abundance_rescue.py \
            scripts/stage10_multik_rescue.py \
            scripts/stage11_aggressive_rescue.py \
            scripts/pair_gap_refine.py \
            scripts/fill_scaffold_gaps.py \
            scripts/fill_scaffold_gaps_multik.py \
            scripts/test_stage11_aggressive.py
          PYTHONPATH=scripts python3 scripts/test_stage789_optimizer.py
          PYTHONPATH=scripts python3 scripts/test_low_abundance_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage10_multik_rescue.py
          PYTHONPATH=scripts python3 scripts/test_stage11_aggressive.py
          cargo build --release

      - name: Build fixed Stage8 backbone
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage8.time.txt \
            python3 scripts/na50_repeat_pipeline.py \
              --bridgeasm target/release/bridgeasm \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --output benchmark/bridge_repeat \
              --threads "$THREADS" \
              --segment-anchor-bases 31
          python3 scripts/stage8_backbone_optimizer.py \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --segment-anchor-bases 31 \
              --lookahead-depth 3 \
              --lookahead-max-branch 4

      - name: Run Stage11 aggressive candidates
        run: |
          set -euo pipefail
          /usr/bin/time -v -o benchmark/stage11.time.txt \
            python3 scripts/stage11_aggressive_rescue.py \
              --bridgeasm target/release/bridgeasm \
              --pipeline-dir benchmark/bridge_repeat \
              --read1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
              --read2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
              --threads "$THREADS" \
              --ks 15,17,21,25,31
          cp benchmark/bridge_repeat/bridge_backbone.fasta benchmark/assemblies/bridge_stage8_backbone.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_stage8_localfill/primary_contigs.fasta benchmark/assemblies/bridge_stage8_localfill.fasta
          cp benchmark/bridge_repeat/stage11_flow_aggressive.fasta benchmark/assemblies/bridge_flow_aggressive.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_localfill/primary_contigs.fasta benchmark/assemblies/bridge_flow_localfill.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_rare_consensus/primary_contigs.fasta benchmark/assemblies/bridge_rare_consensus.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_rare_consensus_localfill/primary_contigs.fasta benchmark/assemblies/bridge_rare_consensus_localfill.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_rare_aggressive/primary_contigs.fasta benchmark/assemblies/bridge_rare_aggressive.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_rare_consensus/primary_contigs.fasta benchmark/assemblies/bridge_flow_rare_consensus.fasta
          cp benchmark/bridge_repeat/stage11_aggressive/candidate_flow_rare_localfill/primary_contigs.fasta benchmark/assemblies/bridge_flow_rare_localfill.fasta

      - name: FASTA stats
        run: |
          for f in benchmark/assemblies/bridge_*.fasta; do
            name="$(basename "$f" .fasta)"
            python3 scripts/fasta_stats.py "$f" --json "benchmark/${name}.stats.json" \
              > "benchmark/${name}.stats.tsv"
          done

      - name: Run metaSPAdes control
        run: |
          /usr/bin/time -v -o benchmark/metaspades.time.txt \
            metaspades.py -1 /tmp/zymo-log/ERR2935805_1.fastq.gz \
                          -2 /tmp/zymo-log/ERR2935805_2.fastq.gz \
                          -o benchmark/metaspades -t "$THREADS" -m 6 --only-assembler
          cp benchmark/metaspades/contigs.fasta benchmark/assemblies/metaspades.fasta

      - name: Run combined-reference MetaQUAST
        run: |
          set -euo pipefail
          python3 /tmp/quast-5.3.0/metaquast.py \
            benchmark/assemblies/bridge_stage8_backbone.fasta \
            benchmark/assemblies/bridge_stage8_localfill.fasta \
            benchmark/assemblies/bridge_flow_aggressive.fasta \
            benchmark/assemblies/bridge_flow_localfill.fasta \
            benchmark/assemblies/bridge_rare_consensus.fasta \
            benchmark/assemblies/bridge_rare_consensus_localfill.fasta \
            benchmark/assemblies/bridge_rare_aggressive.fasta \
            benchmark/assemblies/bridge_flow_rare_consensus.fasta \
            benchmark/assemblies/bridge_flow_rare_localfill.fasta \
            benchmark/assemblies/metaspades.fasta \
            -r /tmp/zymo-references.fasta \
            -o benchmark/metaquast --threads "$THREADS" --min-contig 200 --no-plots
          python3 scripts/summarize_metaquast.py \
            benchmark/metaquast/combined_reference/transposed_report.tsv \
            --json benchmark/metaquast_summary.json \
            | tee benchmark/metaquast_summary.tsv

      - name: Run per-bacterium QUAST
        run: |
          set -euo pipefail
          assemblies=(benchmark/assemblies/bridge_stage8_backbone.fasta benchmark/assemblies/bridge_stage8_localfill.fasta benchmark/assemblies/bridge_flow_aggressive.fasta benchmark/assemblies/bridge_flow_localfill.fasta benchmark/assemblies/bridge_rare_consensus.fasta benchmark/assemblies/bridge_rare_consensus_localfill.fasta benchmark/assemblies/bridge_rare_aggressive.fasta benchmark/assemblies/bridge_flow_rare_consensus.fasta benchmark/assemblies/bridge_flow_rare_localfill.fasta benchmark/assemblies/metaspades.fasta)
          for ref in /tmp/zymo-species-refs/{Bacillus_subtilis,Enterococcus_faecalis,Escherichia_coli,Lactobacillus_fermentum,Listeria_monocytogenes,Pseudomonas_aeruginosa,Salmonella_enterica,Staphylococcus_aureus}.fasta; do
            species="$(basename "$ref" .fasta)"
            python3 /tmp/quast-5.3.0/quast.py "${assemblies[@]}" -r "$ref" \
              -o "benchmark/species_quast/$species" --threads "$THREADS" --min-contig 200 --no-plots
          done
          python3 scripts/summarize_species_quast.py benchmark/species_quast \
            --json benchmark/species_summary.json | tee benchmark/species_summary.tsv

      - name: Score strict and exploratory gates
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def read_rows(path):
              with Path(path).open() as handle:
                  return list(csv.DictReader(handle, delimiter='\t'))

          meta = {r['Assembly']: r for r in read_rows('benchmark/metaquast_summary.tsv')}
          species = {r['assembly']: r for r in read_rows('benchmark/species_summary.tsv')}
          baseline = 'bridge_stage8_backbone'
          candidates = [
              'bridge_stage8_localfill', 'bridge_flow_aggressive', 'bridge_flow_localfill',
              'bridge_rare_consensus', 'bridge_rare_consensus_localfill', 'bridge_rare_aggressive',
              'bridge_flow_rare_consensus', 'bridge_flow_rare_localfill'
          ]
          b = meta[baseline]
          bgf = float(species[baseline]['bacteria_mean_gf'])
          bna = float(b['NA50'])
          bmis = int(float(b['# misassemblies']))
          with Path('benchmark/stage11_gate.tsv').open('w') as out:
              out.write('assembly\tmean_gf\tmean_gf_delta\tpseudomonas_gf\tcombined_gf\tna50\tna50_delta\tdup\tmisassemblies\tlocal_misassemblies\tstrict_gate\texploratory_gate\n')
              for name in candidates:
                  m = meta[name]
                  s = species[name]
                  mean_gf = float(s['bacteria_mean_gf'])
                  na50 = float(m['NA50'])
                  dup = float(m['Duplication ratio'])
                  mis = int(float(m['# misassemblies']))
                  local = int(float(m['# local misassemblies']))
                  strict = (
                      dup <= 1.008 and mis <= 12 and local <= 6
                      and mean_gf >= bgf and na50 >= 0.95 * bna
                  )
                  explore = (
                      dup <= 1.015 and mis <= 16 and local <= 10
                      and (mean_gf >= bgf + 0.05 or na50 >= 1.10 * bna)
                  )
                  out.write(
                      f"{name}\t{mean_gf:.4f}\t{mean_gf-bgf:+.4f}\t{s['pseudomonas_gf']}"
                      f"\t{m['Genome fraction (%)']}\t{na50:.1f}\t{na50-bna:+.1f}\t{dup:.4f}"
                      f"\t{mis}\t{local}\t{'PASS' if strict else 'FAIL'}\t{'PASS' if explore else 'FAIL'}\n"
                  )
          print(Path('benchmark/stage11_gate.tsv').read_text())
          PY

      - name: Save provenance
        run: |
          cp /tmp/zymo-log/subset_provenance.json benchmark/
          printf 'commit\t%s\nread_pairs\t%s\nthreads\t%s\ndataset\tERR2935805_first_pairs\nproduction_backbone\tstage8_depth3\nstage11_flow\tcoverage_plus_physical_context_depth5\nstage11_rare\tk15_17_21_25_31_cross_k_consensus\nstage11_gap\tpair_positive_gap_plus_multik_local_sequence_consensus\n' \
            "$GITHUB_SHA" "$PAIRS" "$THREADS" > benchmark/benchmark_provenance.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: zymo-stage11-aggressive-200k
          path: |
            benchmark/assemblies
            benchmark/*.json
            benchmark/*.tsv
            benchmark/*.time.txt
            benchmark/bridge_repeat/pipeline_manifest.json
            benchmark/bridge_repeat/stage8_backbone_stats.json
            benchmark/bridge_repeat/stage11_aggressive/*.json
            benchmark/bridge_repeat/stage11_aggressive/*.tsv
            benchmark/bridge_repeat/stage11_aggressive/candidate_*/gap_consensus.tsv
            benchmark/bridge_repeat/stage11_aggressive/candidate_*/pair_links.tsv
            benchmark/metaquast/combined_reference/report.tsv
            benchmark/metaquast/combined_reference/transposed_report.tsv
            benchmark/species_quast/*/report.tsv
          retention-days: 14
