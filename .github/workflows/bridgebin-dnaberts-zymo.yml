name: BridgeBin DNABERT-S Zymo identity probe

on:
  push:
    branches:
      - codex/bridgebin-v2-signed-evidence
    paths:
      - scripts/bridgebin_dna_embed.py
      - scripts/bridgebin_bio_features.py
      - scripts/bridgebin_eval_embeddings.py
      - scripts/bridgebin_sequence_baseline_features.py
      - scripts/bridgebin_make_pair_dataset.py
      - scripts/bridgebin_pair_head.py
      - scripts/bridgebin_zymo_reference_benchmark.py
      - scripts/split_zymo_references.py
      - .github/workflows/bridgebin-dnaberts-zymo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dnaberts:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DNABERT-S runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.0,<3' 'transformers==4.40.2' einops
          python - <<'PY'
          import sys, torch, transformers, einops
          print('python', sys.version)
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          print('einops', einops.__version__)
          PY

      - name: Prepare deterministic Zymo panel
        run: |
          set -euo pipefail
          mkdir -p benchmark/dnaberts_zymo
          curl -L --retry 3 -o /tmp/zymo-refs.zip \
            'https://zenodo.org/records/3935737/files/ZymoBIOMICS.STD.refseq.v2.zip?download=1'
          mkdir -p /tmp/zymo-refs
          unzip -q /tmp/zymo-refs.zip -d /tmp/zymo-refs
          python scripts/split_zymo_references.py /tmp/zymo-refs -o /tmp/zymo-species-refs >/dev/null
          python scripts/bridgebin_zymo_reference_benchmark.py \
            --reference-dir /tmp/zymo-species-refs \
            --out benchmark/dnaberts_zymo \
            --seed 43 --min-fragment 2200 --max-fragment 8500 --min-contig 1500

          python - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          root = Path('benchmark/dnaberts_zymo')
          truth = []
          with (root / 'truth.tsv').open() as handle:
              reader = csv.DictReader(handle, delimiter='\t')
              for row in reader:
                  if int(row['eligible']):
                      truth.append(row)
          grouped = defaultdict(list)
          for row in truth:
              grouped[row['genome']].append(row)
          selected = set()
          subset_rows = []
          for genome, rows in sorted(grouped.items()):
              rows.sort(key=lambda row: (-int(row['length']), row['contig']))
              for row in rows[:8]:
                  selected.add(row['contig'])
                  subset_rows.append(row)

          records = {}
          name = None
          chunks = []
          with (root / 'contigs.fa').open() as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith('>'):
                      if name is not None:
                          records[name] = ''.join(chunks)
                      name = line[1:].split()[0]
                      chunks = []
                  else:
                      chunks.append(line)
              if name is not None:
                  records[name] = ''.join(chunks)

          with (root / 'panel.fa').open('w') as handle:
              for contig in sorted(selected):
                  seq = records[contig]
                  handle.write(f'>{contig}\n')
                  for start in range(0, len(seq), 80):
                      handle.write(seq[start:start+80] + '\n')

          with (root / 'panel_truth.tsv').open('w', newline='') as handle:
              fieldnames = ['contig', 'genome', 'length', 'eligible', 'record', 'start', 'end']
              writer = csv.DictWriter(handle, fieldnames=fieldnames, delimiter='\t')
              writer.writeheader()
              writer.writerows(sorted(subset_rows, key=lambda row: row['contig']))

          with (root / 'coverage.tsv').open() as source, (root / 'panel_coverage.tsv').open('w') as target:
              reader = csv.reader(source, delimiter='\t')
              writer = csv.writer(target, delimiter='\t', lineterminator='\n')
              writer.writerow(next(reader))
              for row in reader:
                  if row and row[0] in selected:
                      writer.writerow(row)
          print('panel_genomes', len(grouped), 'panel_contigs', len(selected))
          PY

      - name: Measure canonical 5-mer baseline
        run: |
          set -euo pipefail
          python scripts/bridgebin_sequence_baseline_features.py \
            --contigs benchmark/dnaberts_zymo/panel.fa \
            --output benchmark/dnaberts_zymo/kmer5_features.tsv -k 5
          python scripts/bridgebin_eval_embeddings.py \
            --features benchmark/dnaberts_zymo/kmer5_features.tsv \
            --truth benchmark/dnaberts_zymo/panel_truth.tsv \
            --column kmer_embedding \
            --max-contigs-per-genome 8 \
            --precision-target 0.99 \
            --focus Escherichia_coli,Salmonella_enterica \
            --output benchmark/dnaberts_zymo/kmer5_identity_metrics.json
          cat benchmark/dnaberts_zymo/kmer5_identity_metrics.json

      - name: Extract real DNABERT-S embeddings
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -uo pipefail
          log='benchmark/dnaberts_zymo/dnaberts_extract.log'
          {
            echo '=== runtime/model smoke ==='
            python - <<'PY'
          import torch
          from transformers import AutoModel, AutoTokenizer
          name = 'zhihan1996/DNABERT-S'
          tokenizer = AutoTokenizer.from_pretrained(name, trust_remote_code=True)
          model = AutoModel.from_pretrained(name, trust_remote_code=True)
          print('tokenizer', type(tokenizer).__name__)
          print('model', type(model).__name__)
          print('config_model_type', getattr(model.config, 'model_type', None))
          print('max_position_embeddings', getattr(model.config, 'max_position_embeddings', None))
          encoded = tokenizer('ACGT' * 100, return_tensors='pt', truncation=True, max_length=512)
          print('encoded_keys', sorted(encoded.keys()))
          print('input_shape', tuple(encoded['input_ids'].shape))
          with torch.no_grad():
              output = model(**encoded)
          hidden = output.last_hidden_state if hasattr(output, 'last_hidden_state') else output[0]
          print('output_type', type(output).__name__)
          print('last_hidden_state', tuple(hidden.shape))
          PY
            smoke_status=$?
            echo "smoke_status=$smoke_status"
            if [ "$smoke_status" -ne 0 ]; then
              exit "$smoke_status"
            fi
            echo '=== full adapter ==='
            python scripts/bridgebin_dna_embed.py \
              --contigs benchmark/dnaberts_zymo/panel.fa \
              --output benchmark/dnaberts_zymo/dnaberts_windows.tsv \
              --model zhihan1996/DNABERT-S \
              --device cpu \
              --window-bp 1200 --stride-bp 1200 --min-window-bp 512 \
              --max-tokens 512 --batch-size 4
            status=$?
            if [ "$status" -eq 0 ]; then
              python scripts/bridgebin_bio_features.py \
                --dna-embeddings benchmark/dnaberts_zymo/dnaberts_windows.tsv \
                --output benchmark/dnaberts_zymo/dnaberts_features.tsv
              status=$?
            fi
            echo "adapter_status=$status"
            exit "$status"
          } >"$log" 2>&1
          status=$?
          cat "$log"
          exit "$status"

      - name: Measure DNABERT-S genome identity
        run: |
          set -euo pipefail
          python scripts/bridgebin_eval_embeddings.py \
            --features benchmark/dnaberts_zymo/dnaberts_features.tsv \
            --truth benchmark/dnaberts_zymo/panel_truth.tsv \
            --column dna_embedding \
            --max-contigs-per-genome 8 \
            --precision-target 0.99 \
            --focus Escherichia_coli,Salmonella_enterica \
            --output benchmark/dnaberts_zymo/dnaberts_identity_metrics.json
          cat benchmark/dnaberts_zymo/dnaberts_identity_metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark/dnaberts_zymo')
          k=json.loads((root/'kmer5_identity_metrics.json').read_text())
          d=json.loads((root/'dnaberts_identity_metrics.json').read_text())
          print('representation\tauc\tnn_accuracy\tprecision99_recall\tEcoli_Salmonella_median')
          for name,m in [('5mer',k),('DNABERT-S',d)]:
              focus=m['focus_cross_genome_cosine'].get('Escherichia_coli vs Salmonella_enterica',{})
              print(f"{name}\t{m['pair_auc']:.6f}\t{m['nearest_neighbor_genome_accuracy']:.6f}\t{m['high_precision_threshold']['recall']:.6f}\t{focus.get('median',float('nan')):.6f}")
          PY

      - name: Whole-genome-holdout pair-head probe
        run: |
          set -euo pipefail
          python scripts/bridgebin_make_pair_dataset.py \
            --truth benchmark/dnaberts_zymo/panel_truth.tsv \
            --coverage benchmark/dnaberts_zymo/panel_coverage.tsv \
            --output benchmark/dnaberts_zymo/panel_pairs.tsv \
            --anchors-per-genome 8 \
            --positive-per-contig 4 \
            --negative-genomes-per-contig 4 \
            --negative-anchors-per-genome 2
          python scripts/bridgebin_pair_head.py train \
            --features benchmark/dnaberts_zymo/dnaberts_features.tsv \
            --pairs benchmark/dnaberts_zymo/panel_pairs.tsv \
            --model-out benchmark/dnaberts_zymo/dnaberts_pair_head.json \
            --validation-fraction 0.25 \
            --epochs 500 --negative-weight 3 \
            --precision-target 0.99 \
            --require-group-holdout \
            | tee benchmark/dnaberts_zymo/dnaberts_pair_head_metrics.jsonl
          cat benchmark/dnaberts_zymo/dnaberts_pair_head.json

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgebin-dnaberts-zymo-probe
          path: benchmark/dnaberts_zymo
          retention-days: 14
