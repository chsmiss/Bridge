name: Apply major path-cover update

on:
  push:
    branches:
      - codex/bridgeasm-rust-v0
    paths:
      - .github/workflows/apply-major-path-cover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply, format, and validate major path-cover source
        shell: bash
        run: |
          gzip --decompress --stdout .github/patches/bridgeasm-major-path.patch.gz > /tmp/major.patch
          git apply --check /tmp/major.patch
          git apply /tmp/major.patch
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src/assembler.rs src/main.rs tests/integration.rs
          git commit -m 'feat: add evidence-weighted major path cover'
          git push origin HEAD:codex/bridgeasm-rust-v0
