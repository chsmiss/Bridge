[package]
name = "bridgeasm"
version = "0.1.0"
edition = "2021"
description = "Evidence-aware short-read metagenome assembler prototype"
license = "MIT"
repository = "https://github.com/chsmiss/Bridge"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
rayon = "1.10"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
